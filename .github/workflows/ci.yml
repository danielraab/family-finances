name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: gofmt
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not gofmt'd:"
            echo "$UNFORMATTED"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...

  # Builds and publishes the combined image. Only runs for pushes to the
  # repository's default branch, after both lint/test jobs succeed.
  publish:
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute next daily tag
        id: version
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          IMAGE_PATH="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${IMAGE_PATH}"
          DATE="$(date -u +%Y%m%d)"

          # Mint a scoped pull token the same way `docker login`/`docker pull`
          # would, so this works whether or not the package has been pushed
          # to yet (a brand-new package still resolves a token; the
          # tags/list call below 404s until the first push).
          TOKEN="$(curl -fsSL -u "${GHCR_USER}:${GHCR_TOKEN}" \
            "https://ghcr.io/token?scope=repository:${IMAGE_PATH}:pull" | jq -r .token)"

          TAGS="$(curl -fsSL -H "Authorization: Bearer ${TOKEN}" \
            "https://ghcr.io/v2/${IMAGE_PATH}/tags/list" 2>/dev/null | jq -r '.tags[]?' || true)"

          MAX=0
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            if [[ "$t" =~ ^${DATE}-([0-9]+)$ ]]; then
              n="${BASH_REMATCH[1]}"
              if [ "$n" -gt "$MAX" ]; then MAX="$n"; fi
            fi
          done <<< "$TAGS"

          NEXT=$((MAX + 1))
          TAG="${DATE}-${NEXT}"

          echo "Computed tag: ${TAG} (existing tags today: ${MAX})"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.tag }}
            ${{ steps.version.outputs.image }}:latest
