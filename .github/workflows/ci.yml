name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  # Lints the OpenAPI contract and fails if the generated artifacts
  # (frontend types, backend embedded copy) are stale relative to it.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Lint openapi/openapi.yaml
        run: pnpm dlx @stoplight/spectral-cli lint openapi/openapi.yaml --ruleset openapi/.spectral.yaml
      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Regenerate the frontend API types
        working-directory: frontend
        run: pnpm generate:api
      - name: Sync the backend copy of the contract
        run: cp openapi/openapi.yaml backend/openapi.yaml
      - name: Fail on contract drift
        run: git diff --exit-code -- frontend/src/api/schema.d.ts backend/openapi.yaml

  # Reports per-locale translation coverage against en.json (the source of
  # truth — see frontend/AGENTS.md). Informational only: continue-on-error
  # keeps a shortfall from failing the workflow, and no other job needs:
  # this one or is needed by it, so it never gates or delays anything else.
  i18n-coverage:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compute translation coverage
        run: node frontend/scripts/i18n-coverage.mjs
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- i18n-coverage-report -->";
            const body = fs.readFileSync(
              `${process.env.RUNNER_TEMP}/i18n-coverage-report.md`,
              "utf8",
            );
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # Unit/handler tests only. No database is available here, so the
  # internal/storage/postgres integration tests self-skip (DATABASE_URL is
  # unset) — see the backend-integration job below for those.
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: gofmt
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not gofmt'd:"
            echo "$UNFORMATTED"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...

  # Runs the internal/storage/postgres integration tests against a real
  # Postgres. Scoped to pull requests: integration tests are not part of the
  # always-on push pipeline, only the PR gate (see backend/AGENTS.md).
  backend-integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: familyfinances
          POSTGRES_PASSWORD: familyfinances
          POSTGRES_DB: familyfinances
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U familyfinances -d familyfinances"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://familyfinances:familyfinances@localhost:5432/familyfinances?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: go test ./internal/storage/postgres/...

  # Builds and publishes the combined image. Only runs when a new git tag is
  # pushed, using that tag as the image tag.
  publish:
    needs: [frontend, backend, contract]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: version
        run: |
          IMAGE_PATH="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${IMAGE_PATH}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ github.ref_name }}
            ${{ steps.version.outputs.image }}:latest
