        default_currency:
          type: string
        displayed_decimal_places:
          type: integer
          minimum: 0
          maximum: 4
        week_start:
          type: string
          enum: [monday, sunday]
        recurring_preview_horizon:
          $ref: "#/components/schemas/RecurringPreviewHorizon"

    Error:
