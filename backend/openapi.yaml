        type:
          type: string
          description: >-
            Free-text label; trimmed on write. When present it must be
            non-empty after trimming. Omitting the field leaves it
            unchanged.
        currency:
          type: string
          description: >-
            Rejected (400) once the account has any entry at all — see
            Account's currency description.
        financial_institute:
          type: string
        opening_date:
          type: string
          format: date
        closing_date:
          type: string
          format: date
          nullable: true
          description: Explicit null clears it (re-opening the account).

    AccountPermission:
      type: string
      enum: [view, append, entry_admin, owner]
      description: >-
        Four tiers, each a strict superset of the one before it: view
