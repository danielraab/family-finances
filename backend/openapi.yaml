      description: >-
        Two shareable tiers, each a strict superset of the one before it:
        view (the category resolves in entry-list/report filters and on
        entries already categorized under it, but cannot be newly selected),
        append (+ selectable when categorizing an entry). owner is the real
        owner's own, implicit permission — never a valid value for a share;
        only the real owner may ever edit a category's own metadata,
        lifecycle, or shares.

    CategoryShare:
      type: object
