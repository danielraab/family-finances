openapi: 3.0.3

info:
  title: family-finances API
  version: 0.4.1
  description: >-
    The JSON HTTP API of the family-finances backend. This document is
    hand-written and is the source of truth for the API surface (see
    openapi/README.md). Operations tagged `browser-flow` and marked
    `x-internal: true` are browser-navigation redirects, not part of the
    generated typed client.

servers:
  - url: /
    description: Same-origin — the Go backend serves both the API and the SPA.

tags:
  - name: health
    description: Liveness / readiness.
  - name: auth
    description: >-
      Sign-in, session, and invites — including the admin-only user and
      invitation administration endpoints.
  - name: settings
    description: >-
      Per-user preferences (language, timezone, default currency, displayed
      decimal places).
  - name: accounts
    description: >-
      Bookkeeping accounts, each owned by exactly one user. An account's
      type is a free-text label stored on the account itself.
  - name: categories
    description: The caller's own tree-structured category lookup.
  - name: tags
    description: Per-user tags, private to their owner.
  - name: entries
    description: >-
      Transactions and balance adjustments recorded against an account,
      including live balance computation and a filterable/searchable/
      sortable, cursor-paginated listing.
  - name: recurring-transactions
    description: >-
      Recurring transaction templates recorded against an account — a
      recurrence rule (interval unit/count), computed per-year amount and
      next-suggested-date, and the entries created from or linked to them.
  - name: dashboard
    description: >-
      The caller's own ordered set of /home dashboard cards. Each card's
      filter is an inline value on the card itself — there is no separate
      saved-query entity.
  - name: browser-flow
    description: >-
      Endpoints a browser reaches by full-page navigation, not fetch. Documented
      for completeness; excluded from the generated client.
  - name: meta
    description: The API describing itself.

paths:
  /api/healthz:
    get:
      operationId: getHealthz
      summary: Readiness probe — pings the database
      tags: [health]
      security: []
      responses:
        "200":
          description: The database answered a bounded ping.
          content:
            text/plain:
              schema:
                type: string
              example: ok
        "503":
          description: No database is configured or it did not answer.
          content:
            text/plain:
              schema:
                type: string

  /api/openapi.yaml:
    get:
      operationId: getOpenAPIDocument
      summary: This OpenAPI document
      tags: [meta]
      security: []
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string

  /api/auth/config:
    get:
      operationId: getAuthConfig
      summary: Sign-in methods the client should offer
      description: >-
        Unauthenticated. Reports the sign-in affordances the web client should
        render on the login page. Exposes no provider secrets.
      tags: [auth]
      security: []
      responses:
        "200":
          description: The available sign-in affordances.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"

  /api/auth/me:
    get:
      operationId: getAuthMe
      summary: The authenticated user
      tags: [auth]
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: patchAuthMe
      summary: Update the authenticated user's profile
      description: >-
        Sets the current user's display name. The submitted value is trimmed of
        surrounding whitespace; the trimmed value must match
        `^[\p{L} .'-]{0,150}$` (Unicode letters, spaces, `.`, `'`, `-`; at most
        150 characters). An empty string is accepted and clears the name.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/logout:
    post:
      operationId: postAuthLogout
      summary: Revoke the current session
      tags: [auth]
      responses:
        "204":
          description: Session revoked. For a browser the ff_session cookie is cleared.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/email/start:
    post:
      operationId: postAuthEmailStart
      summary: Start a magic-link sign-in
      description: >-
        Always returns 200 regardless of whether an account exists or a mail was
        sent, to prevent account enumeration.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailStartRequest"
      responses:
        "200":
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOk"
        "400":
          description: Malformed request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/invites:
    post:
      operationId: postAuthInvites
      summary: Invite an email address
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
      responses:
        "201":
          description: Invite created and an acceptance email sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "400":
          description: Malformed request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Inviting is disabled on this instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: getAuthInvites
      summary: List every invitation (admin only)
      description: >-
        Every non-soft-deleted invite regardless of status (pending,
        accepted, expired, or revoked), newest first, each carrying the
        inviter's identity.
      tags: [auth]
      responses:
        "200":
          description: Every invitation.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/auth/invites/mine:
    get:
      operationId: getAuthInvitesMine
      summary: List the authenticated user's own invitations
      description: >-
        Every non-soft-deleted invite the caller personally created,
        regardless of status. No admin requirement.
      tags: [auth]
      responses:
        "200":
          description: The caller's own invitations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/invites/{id}/revoke:
    post:
      operationId: postAuthInviteRevoke
      summary: Revoke an invitation
      description: >-
        Permitted for the invite's own inviter or an admin. Idempotent — a
        repeat call on an already-revoked invite succeeds without changing
        its revoked_at. Permitted regardless of the invite's current status;
        a revoked invite stays visible in every listing.
      tags: [auth]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The invitation, now revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            The caller neither created this invitation nor is an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such invitation (or it has been soft-deleted).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/invites/{id}:
    delete:
      operationId: deleteAuthInvite
      summary: Soft-delete a revoked invitation (admin only)
      description: >-
        Rejected with 409 unless the invitation has already been revoked.
        One-way — there is no undelete endpoint. A soft-deleted invitation
        is excluded from both invitation listings.
      tags: [auth]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The invitation is soft-deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such invitation (or it is already soft-deleted).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/auth/users:
    get:
      operationId: getAuthUsers
      summary: List every non-deleted user (admin only)
      tags: [auth]
      responses:
        "200":
          description: Every non-soft-deleted user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/auth/users/{id}/disable:
    post:
      operationId: postAuthUserDisable
      summary: Disable a user and revoke their sessions immediately (admin only)
      description: >-
        No check prevents an admin from disabling their own account, including
        as the only remaining admin.
      tags: [auth]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The user, now disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/users/{id}/enable:
    post:
      operationId: postAuthUserEnable
      summary: Re-enable a disabled user (admin only)
      description: Does not restore any session revoked while disabled.
      tags: [auth]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The user, now enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/users/{id}:
    delete:
      operationId: deleteAuthUser
      summary: Soft-delete a user and revoke their sessions immediately (admin only)
      description: >-
        One-way in this API — there is no undelete endpoint. No check
        prevents an admin from deleting their own account, including as the
        only remaining admin.
      tags: [auth]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The user is soft-deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/settings:
    get:
      operationId: getSettings
      summary: The authenticated user's resolved settings
      description: >-
        Always fully populated — a field never set by the user resolves to
        its hardcoded application default.
      tags: [settings]
      responses:
        "200":
          description: The resolved settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: putSettings
      summary: Update one or more of the authenticated user's settings
      description: >-
        Partial update: only the fields present in the body are changed.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSettingsUpdate"
      responses:
        "200":
          description: The resolved settings after the update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
        "400":
          description: A field included in the body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/accounts:
    get:
      operationId: getAccounts
      summary: List the caller's accounts
      tags: [accounts]
      responses:
        "200":
          description: Every non-deleted account the caller owns.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: postAccounts
      summary: Create an account
      description: 422 when `type` is empty or only whitespace.
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreate"
      responses:
        "201":
          description: The created account, owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/accounts/{id}:
    get:
      operationId: getAccount
      summary: Get an account
      description: >-
        404 for an account the caller does not own, identical to a
        nonexistent one — existence is not disclosed across owners.
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchAccount
      summary: Update an account
      description: >-
        422 when `type` is present but empty or only whitespace. A shared
        `owner`-tier caller may change `type` like any other field. `currency`
        becomes immutable once the account has any entry at all (of any
        kind) — 400 on a `currency` change against such an account,
        regardless of whether the new value differs from the current one.
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: deleteAccount
      summary: Soft-delete an account
      description: One-way — there is no undelete endpoint.
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "204":
          description: The account is soft-deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/accounts/{id}/disable:
    post:
      operationId: postAccountDisable
      summary: Disable an account
      description: >-
        Reversible via enable. Blocks creating new entries against the
        account; does not hide it or affect its existing entries.
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: The account, now disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/accounts/{id}/enable:
    post:
      operationId: postAccountEnable
      summary: Re-enable a disabled account
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: The account, now enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/accounts/{id}/shares:
    get:
      operationId: getAccountShares
      summary: List an account's shares
      description: >-
        Visible to any caller holding at least view permission (real
        ownership or any share) — every user with access to an account can
        see who else has access. Does not include the real owner as a row
        (their identity is on the Account itself via owner_name); a
        client renders that as the fixed first row separately.
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: Every current share on the account.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountShare"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: postAccountShare
      summary: Share an account with a user by email
      description: >-
        Owner-tier only (real owner or a shared owner). Unlike
        authentication's anti-enumeration endpoints, this deliberately does
        not hide whether email matched a registered user — the caller
        already holds an authenticated, owner-tier grant on a real account.
        A match creates or updates (200-201, share overwrites any existing
        one for that user in place) a share and emails the recipient a
        notification with an application link. No match returns 200 with
        matched: false and invite_allowed reflecting whether the instance
        currently permits sending a new application invite for that email;
        no share is created. Sharing with the caller's own email or the
        account's real owner's email is rejected (400).
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountShareInvite"
      responses:
        "200":
          description: No user matched that email; see invite_allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountShareInviteResult"
        "201":
          description: The share was created or updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountShareInviteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/accounts/{id}/shares/{userId}:
    patch:
      operationId: patchAccountShare
      summary: Change a share's permission
      description: >-
        Owner-tier only. The real owner can never be a target (400) — they
        carry no share row to change.
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/ShareUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountSharePermissionUpdate"
      responses:
        "200":
          description: The updated share.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountShare"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAccountShare
      summary: Revoke a share, or leave a shared account
      description: >-
        Owner-tier callers may target any user's share (revoke). Any user
        may target their own (userId equal to the caller's own id) —
        self-leave, requiring no owner-tier permission of its own. Either
        way access is removed immediately and unconditionally (no soft
        delete); entries the removed user created remain on the account,
        attributed to them, for every remaining permission holder. The
        real owner can never be a target (400) — they carry no share row,
        so self-leave is unavailable to them.
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/ShareUserId"
      responses:
        "204":
          description: The share is removed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/accounts/{id}/balance:
    get:
      operationId: getAccountBalance
      summary: The account's live balance
      description: >-
        Always computed live, never cached — see the account-entries
        capability. Equals the latest non-deleted balance_adjustment at or
        before as_of (or 0 if none), plus every non-deleted transaction
        after it, up to as_of.
      tags: [entries]
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - name: as_of
          in: query
          required: false
          description: RFC3339 timestamp. Defaults to now.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: The computed balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/account-types:
    get:
      operationId: getAccountTypes
      summary: List the caller's distinct in-use account type labels
      description: >-
        The distinct, non-empty `type` values on the caller's own
        non-deleted accounts, trimmed, compared verbatim (case-sensitive),
        sorted case-insensitively ascending. For client autocomplete only;
        there is no endpoint to create, rename, disable, or delete a type
        — a type exists by being written on an account.
      tags: [accounts]
      responses:
        "200":
          description: The caller's distinct in-use type labels.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/categories:
    get:
      operationId: getCategories
      summary: List the caller's category tree
      tags: [categories]
      responses:
        "200":
          description: Every non-deleted category the caller owns, including its parent_id.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: postCategories
      summary: Create a category
      description: >-
        Appended to the end of its sibling group (same parent_id, or root if
        omitted).
      tags: [categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryWrite"
      responses:
        "201":
          description: The created category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/categories/{id}:
    get:
      operationId: getCategory
      summary: Get a category
      description: >-
        Visible to any caller holding at least view permission on it (real
        ownership or any share).
      tags: [categories]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchCategory
      summary: Update a category
      description: >-
        Reparenting onto the category itself or one of its own descendants
        is rejected with 422. A reparent is appended to the end of the new
        parent's sibling group.
      tags: [categories]
      parameters:
