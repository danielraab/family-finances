          type: string
          format: date

    AccountUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        icon:
          type: string
          pattern: ^([a-z0-9-]{1,40})?$
          description: >-
            Optional opaque client icon token. An empty string clears it;
