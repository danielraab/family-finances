          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryWrite"
      responses:
        "200":
          description: The updated category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: deleteCategory
      summary: Delete a category
      description: >-
        A soft delete (irreversible — no undelete). 409 if it has a
        non-deleted child category or is referenced by a non-deleted entry —
        deletion is never cascaded.
      tags: [categories]
      parameters:
        - name: id
          in: path
          required: true
