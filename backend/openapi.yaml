  /api/entries:
    get:
      operationId: getEntries
      summary: List the caller's entries, filtered/searched/sorted, cursor-paginated
      description: >-
        A self_transfer entry is listed once per account it touches that is
        within the caller's requested/resolved account scope: once (amount
        as stored) when only account_id is in scope, once (amount sign
        flipped, account_id/to_account_id swapped) when only to_account_id
        is in scope, and twice — one occurrence per account — when both are
        in scope at once (e.g. an unfiltered listing across every account
        the caller can see, or an explicit account_id filter naming both).
        Every other filter applies identically to both occurrences, since
        they represent the same underlying entry.
      tags: [entries]
      parameters:
        - name: account_id
          in: query
          required: false
          description: Repeatable. Omitted means every account the caller owns.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: category_id
          in: query
          required: false
          description: >-
            Matches this category, plus every descendant unless
            category_mode=exact.
          schema:
            type: string
        - name: category_mode
          in: query
          required: false
          description: >-
            Only meaningful together with category_id. subtree (the
            default) matches the category and every descendant; exact
            matches only that category.
          schema:
            type: string
            enum: [subtree, exact]
            default: subtree
        - name: tag_id
          in: query
          required: false
          schema:
            type: string
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EntryKind"
        - name: recurring_transaction_id
          in: query
          required: false
          description: Matches only entries linked to this recurring transaction.
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Inclusive booking_timestamp lower bound, RFC3339.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Inclusive booking_timestamp upper bound, RFC3339.
          schema:
            type: string
            format: date-time
        - name: q
          in: query
          required: false
          description: Case-insensitive substring match against title, description, or counterparty.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [booking_timestamp, amount]
            default: booking_timestamp
        - name: dir
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: after
          in: query
          required: false
          description: Opaque cursor from a previous response's next_cursor.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: A page of matching entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: postEntries
      summary: Create an entry
      description: >-
        422 when account_id does not name an account the caller owns, or
        names a disabled account. For kind=self_transfer, the same checks
        additionally apply to to_account_id, which must also share
        account_id's currency and differ from it (400 otherwise).
      tags: [entries]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryCreate"
      responses:
        "201":
          description: The created entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/entries/summary:
    get:
      operationId: getEntriesSummary
      summary: Sum the caller's matching entries per currency, without paging
      description: >-
        Accepts the same account_id, category_id/category_mode, tag_id,
        from/to, and q filters as GET /api/entries (no sort, dir, after, or
        limit — this is an aggregate, not a page). Always additionally
        restricted to kind=transaction or kind=self_transfer, regardless of
        the caller's other filters — a balance_adjustment is an absolute
        reading, not a categorized delta. A self_transfer contributes to
        the sum once per account, exactly like GET /api/entries lists it —
        twice when both its accounts are within scope, netting to zero for
        that currency. Computed directly rather than by paging through
        results, so it is accurate however many entries match.
      tags: [entries]
      parameters:
        - name: account_id
          in: query
          required: false
          description: Repeatable. Omitted means every account the caller owns.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: category_id
          in: query
          required: false
          description: >-
            Matches this category, plus every descendant unless
            category_mode=exact.
          schema:
            type: string
        - name: category_mode
          in: query
          required: false
          schema:
            type: string
            enum: [subtree, exact]
            default: subtree
        - name: tag_id
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Inclusive booking_timestamp lower bound, RFC3339.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Inclusive booking_timestamp upper bound, RFC3339.
          schema:
            type: string
            format: date-time
        - name: q
          in: query
          required: false
          description: Case-insensitive substring match against title, description, or counterparty.
          schema:
            type: string
      responses:
        "200":
          description: The matching transaction entries' amounts, summed per currency.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntrySummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/entries/flow-summary:
    get:
      operationId: getEntriesFlowSummary
      summary: >-
        Bucket the caller's matching entries into per-month or per-day
        income/outcome totals
      description: >-
        Buckets the caller's own, non-deleted accounts' non-deleted entries
        by booking_timestamp — one bucket per calendar month of year when
        unit=month, or one bucket per calendar day of year/month when
        unit=day — using the caller's resolved timezone setting (see
        user-settings) to decide bucket boundaries, default UTC. Within
        each bucket, entries whose amount is positive are summed into
        income and the absolute value of entries whose amount is negative
        into outcome, grouped per currency (the currency of the entry's
        account) the same way GET /api/entries/summary groups its sum.
        Unlike GET /api/entries/summary, a balance_adjustment's amount
        (always a signed delta — see account-entries) is included, not
        excluded. This applies uniformly to transaction, balance_adjustment,
        and self_transfer entries; a self_transfer contributes to each of
        its two accounts' own bucket independently, the same as
        GET /api/entries and GET /api/entries/summary. Every period in the
        requested range is present, even one with no matching entries at
        all (empty income/outcome). Accepts the same category_id/
        category_mode and tag_id filters as GET /api/entries/summary,
        applied before bucketing.
      tags: [entries]
      parameters:
        - name: account_id
          in: query
          required: false
          description: Repeatable. Omitted means every account the caller owns.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: category_id
          in: query
          required: false
          description: >-
            Matches this category, plus every descendant unless
            category_mode=exact.
          schema:
            type: string
        - name: category_mode
          in: query
          required: false
          schema:
            type: string
            enum: [subtree, exact]
            default: subtree
        - name: tag_id
          in: query
          required: false
          schema:
            type: string
        - name: unit
          in: query
          required: true
          schema:
            type: string
            enum: [month, day]
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: month
          in: query
          required: false
          description: 1-12. Required when unit=day, rejected when unit=month.
          schema:
            type: integer
      responses:
        "200":
          description: One bucket per period in the requested range.
          content:
            application/json:
              schema:
                type: object
                required: [buckets]
                properties:
                  buckets:
                    type: array
                    items:
                      $ref: "#/components/schemas/FlowBucket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/entries/balance-series:
    get:
      operationId: getEntriesBalanceSeries
      summary: The caller's running account balance sampled per day over a month
      description: >-
        Returns the running balance of the caller's own, non-deleted
        accounts sampled at each local midnight of year/month — one point at
        00:00 on every calendar day of the month, plus a closing point at
        00:00 on the first day of the following month — using the caller's
        resolved timezone setting (see user-settings) to place those
        midnight boundaries, default UTC. Each point's value is the balance
        computed exactly as GET /api/accounts/{id}/balance computes it as of
        that instant (a balance_adjustment acts as an anchor), grouped per
        currency (the currency of the contributing accounts); accounts
        sharing a currency are summed. Every currency present in the
        selected accounts appears on every point, including with an amount
        of 0 — unlike flow-summary, a balance line needs a value at every
        point. A month with no activity is a run of identical points.
        Unlike GET /api/entries and GET /api/entries/summary, this operation
        accepts no category_id, category_mode, tag_id, from, to, or q — a
        category- or tag-filtered "balance" is not a balance, since a
        balance_adjustment carries neither; supplying any of them is a 400.
      tags: [entries]
      parameters:
        - name: account_id
          in: query
          required: false
          description: Repeatable. Omitted means every account the caller owns.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: unit
          in: query
          required: true
          description: Only "day" is defined.
          schema:
            type: string
            enum: [day]
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: month
          in: query
          required: true
          description: 1-12.
          schema:
            type: integer
      responses:
        "200":
          description: One point per day of the requested month, plus a closing point.
          content:
            application/json:
              schema:
                type: object
                required: [points]
                properties:
                  points:
                    type: array
                    items:
                      $ref: "#/components/schemas/BalancePoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/entries/counterparties:
    get:
      operationId: getEntryCounterparties
      summary: List the caller's distinct in-use counterparty labels
      description: >-
        The distinct, non-empty `counterparty` values on the caller's own
        non-deleted entries, compared verbatim (case-sensitive), sorted
        case-insensitively ascending. For client autocomplete only; there
        is no endpoint to create, rename, or delete a counterparty value —
        it exists by being written on an entry.
      tags: [entries]
      responses:
        "200":
          description: The caller's distinct in-use counterparty labels.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/entries/{id}:
    get:
      operationId: getEntry
      summary: Get an entry
      tags: [entries]
      parameters:
        - $ref: "#/components/parameters/EntryId"
      responses:
        "200":
          description: The entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchEntry
      summary: Update an entry
      description: >-
        kind is immutable — there is no field for it on this request body.
        account_id may be changed to move the entry to a different account
        the caller owns; a disabled target account is rejected (422), the
        same as entry creation. For a self_transfer, account_id may not be
        changed at all (422), and any edit requires the caller to currently
        hold append+ permission on both of its accounts — 403 when either
        has since become inaccessible (a revoked share, or the account
        disabled/deleted), even for a change unrelated to the amount or
        either account.
      tags: [entries]
      parameters:
        - $ref: "#/components/parameters/EntryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryUpdate"
      responses:
        "200":
          description: The updated entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: deleteEntry
      summary: Soft-delete an entry
      description: >-
        One-way — there is no undelete endpoint. For a self_transfer,
        entry_admin/owner (or append, if the caller created it) on either
        of its two accounts is sufficient — unlike editing, deleting does
        not require permission on both.
      tags: [entries]
      parameters:
        - $ref: "#/components/parameters/EntryId"
      responses:
        "204":
          description: The entry is soft-deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/entries/{id}/self-transfer:
    post:
      operationId: postEntrySelfTransfer
      summary: Convert a transaction into a self-transfer
      description: >-
        Converts an existing kind: transaction entry into a new kind:
        self_transfer entry, atomically: the original entry is soft-deleted
        and a new entry is created in its place, in one database
        transaction, with the balance-adjustment chain recomputed for every
        account touched. The response's id differs from the path's id — the
        original entry's id is not reused, and GET/PATCH/DELETE on it
        afterward behave as if it were deleted, because it was.

        title, description, booking_timestamp, tag_ids, and category_id
        carry over unchanged. counterparty and location are dropped — a
        self_transfer rejects both, the same as it does on ordinary
        creation. recurring_transaction_id carries over only when
        original_account_role is "sender"; when it is "receiver", the link
        is dropped rather than re-pointed at an account it was never
        actually validated against.

        Authorization: 404 when the caller has no permission at all on the
        entry's account. Otherwise, the same rule POST /api/entries with
        kind: self_transfer already applies to its account_id/to_account_id
        pair is applied here to (the entry's own account, to_account_id):
        append+ permission and non-disabled state required on both (400 for
        insufficient permission, 422 for a disabled account), and both must
        share the same currency (400 otherwise). Converting an entry whose
        kind is not transaction is rejected (400).
      tags: [entries]
      parameters:
        - $ref: "#/components/parameters/EntryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryConvertToSelfTransfer"
      responses:
        "201":
          description: The newly created self_transfer entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/recurring-transactions:
    get:
      operationId: getRecurringTransactions
      summary: List the caller's recurring transactions
      tags: [recurring-transactions]
      parameters:
        - name: account_id
          in: query
          required: false
          description: >-
            Repeatable. Omitted means every non-deleted account the caller
            has any permission on.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        "200":
          description: Every matching recurring transaction.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecurringTransaction"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: postRecurringTransactions
      summary: Create a recurring transaction
      description: >-
        422 when account_id does not name an account the caller can append
        to, or names a disabled account.
      tags: [recurring-transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurringTransactionCreate"
      responses:
        "201":
          description: The created recurring transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringTransaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/recurring-transactions/summary:
    get:
      operationId: getRecurringTransactionsSummary
      summary: >-
        Sum the caller's matching recurring transactions' per-year amounts,
        per currency
      description: >-
        Accepts the same account_id filter as GET /api/recurring-transactions.
        Excludes any recurring transaction whose ends_on is before the
        current date (in the caller's resolved timezone) from the total.
      tags: [recurring-transactions]
      parameters:
        - name: account_id
          in: query
          required: false
          description: >-
            Repeatable. Omitted means every non-deleted account the caller
            has any permission on.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        "200":
          description: The matching, non-ended recurring transactions' per_year_amount, summed per currency.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntrySummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/recurring-transactions/preview:
    get:
      operationId: getRecurringTransactionsPreview
      summary: >-
        Preview upcoming occurrences of the caller's visible recurring
        transactions
      description: >-
        Never persisted — a read-only projection, computed fresh on every
        call. to is required; there is no default cutoff, so this never
        computes an unbounded result. Each recurring transaction's own
        ends_on (when set) additionally clamps its contribution, and
        generation for a single recurring transaction stops after 366
        occurrences regardless of to/ends_on. A recurring transaction whose
        next_suggested_date is already before the current date still
        contributes exactly that one date, marked overdue — never one item
        per interval it has fallen behind by.
      tags: [recurring-transactions]
      parameters:
        - name: account_id
          in: query
          required: false
          description: >-
            Repeatable. Omitted means every non-deleted account the caller
            has any permission on.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: category_id
          in: query
          required: false
          description: >-
            Matches this category, plus every descendant unless
            category_mode=exact.
          schema:
            type: string
        - name: category_mode
          in: query
          required: false
          description: >-
            Only meaningful together with category_id. subtree (the
            default) matches the category and every descendant; exact
            matches only that category.
          schema:
            type: string
            enum: [subtree, exact]
            default: subtree
        - name: tag_id
          in: query
          required: false
          schema:
            type: string
        - name: to
          in: query
          required: true
          description: Inclusive cutoff for every previewed occurrence, RFC3339.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Projected future occurrences, sorted by booking_timestamp ascending.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecurringTransactionPreviewItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/recurring-transactions/{id}:
    get:
      operationId: getRecurringTransaction
      summary: Get a recurring transaction
      tags: [recurring-transactions]
      parameters:
        - $ref: "#/components/parameters/RecurringTransactionId"
      responses:
        "200":
          description: The recurring transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringTransaction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchRecurringTransaction
      summary: Update a recurring transaction
      tags: [recurring-transactions]
      parameters:
        - $ref: "#/components/parameters/RecurringTransactionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurringTransactionUpdate"
      responses:
        "200":
          description: The updated recurring transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringTransaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: deleteRecurringTransaction
      summary: Soft-delete a recurring transaction
      description: >-
        409 while one or more non-deleted entries reference this recurring
        transaction (recurring_transaction_id) — it must be unlinked from
        every entry first. One-way — there is no undelete endpoint.
      tags: [recurring-transactions]
      parameters:
        - $ref: "#/components/parameters/RecurringTransactionId"
      responses:
        "204":
          description: The recurring transaction is soft-deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/dashboard/cards:
    get:
      operationId: getDashboardCards
      summary: List the caller's dashboard cards
      description: >-
        The caller's own cards only, ordered by sort_order. Never includes
        another user's cards, even one referencing an entity shared with
        the caller — a dashboard is always private to its owner.
      tags: [dashboard]
      responses:
        "200":
          description: The caller's cards, in display order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DashboardCard"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: postDashboardCard
      summary: Create a dashboard card
      description: >-
        Appends the card to the end of the caller's list. 400 when type is
        unrecognized, when config is missing a field its type requires,
        when config sets a field foreign to its type, or when an
        account_id/category_id/tag_id in config does not resolve to an
        entity the caller has at least view permission on.
      tags: [dashboard]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DashboardCardCreate"
      responses:
        "201":
          description: The created card.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardCard"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/dashboard/cards/{id}:
    patch:
      operationId: patchDashboardCard
      summary: Update a dashboard card's config
      description: >-
        Accepts only config — a card's type is immutable after creation;
        a type field in the request body, if present, is ignored. Applies
        the same per-type validation as creation.
      tags: [dashboard]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DashboardCardUpdate"
      responses:
        "200":
          description: The updated card.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardCard"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteDashboardCard
      summary: Delete a dashboard card
      tags: [dashboard]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The card is deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/dashboard/cards/{id}/move-up:
    post:
      operationId: postDashboardCardMoveUp
      summary: Move a card up among the caller's cards
      description: >-
        Swaps sort_order with the immediately preceding card. A no-op —
        200, order unchanged — if the card is already first.
      tags: [dashboard]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The card, with its updated (or unchanged) sort_order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardCard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/dashboard/cards/{id}/move-down:
    post:
      operationId: postDashboardCardMoveDown
      summary: Move a card down among the caller's cards
      description: >-
        Swaps sort_order with the immediately following card. A no-op —
        200, order unchanged — if the card is already last.
      tags: [dashboard]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The card, with its updated (or unchanged) sort_order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardCard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/auth/email/callback:
    get:
      operationId: getAuthEmailCallback
      summary: Complete a magic-link sign-in
      description: >-
        Browser clients get a 302 with the ff_session cookie set. A client
        sending `Accept: application/json` (or `?client=api`) instead gets 200
        with a session token in the body.
      tags: [browser-flow]
      x-internal: true
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Signed in; redirect to a safe in-app path.
        "400":
          description: The token is missing, invalid, expired, or already used.

  /api/auth/oidc/start:
    get:
      operationId: getAuthOidcStart
      summary: Begin the OIDC authorization-code flow
      tags: [browser-flow]
      x-internal: true
      security: []
      parameters:
        - name: redirect_to
          in: query
          required: false
          description: Safe same-origin relative path to return to after sign-in.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the identity provider.
        "404":
          description: OIDC is not configured on this instance.

  /api/auth/oidc/callback:
    get:
      operationId: getAuthOidcCallback
      summary: Complete the OIDC authorization-code flow
      description: >-
        Browser clients get a 302 with the ff_session cookie set. A client
        sending `Accept: application/json` instead gets 200 with a session token
        in the body.
      tags: [browser-flow]
      x-internal: true
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Signed in; redirect to a safe in-app path.
        "400":
          description: Missing/unknown state, provider error, or id_token verification failed.

  /api/auth/invites/accept:
    get:
      operationId: getAuthInvitesAccept
      summary: Accept an invite
      description: >-
        Browser clients get a 302 with the ff_session cookie set. A client
        sending `Accept: application/json` instead gets 200 with a session token
        in the body.
      tags: [browser-flow]
      x-internal: true
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Account created / signed in; redirect to a safe in-app path.
        "400":
          description: The invite token is missing, invalid, expired, or already used.

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ff_session
    bearerToken:
      type: http
      scheme: bearer

  responses:
    Unauthorized:
      description: No valid session was presented.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The authenticated user is not an admin.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The request conflicts with the resource's current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: >-
        No such resource — including one that belongs to a different owner,
        which behaves identically to nonexistent (existence is not
        disclosed across owners).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: A field in the request failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: >-
        The request is well-formed but violates a business rule (e.g. a
        reparent that would create a category cycle, or an entry against a
        disabled account).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  parameters:
    AccountId:
      name: id
      in: path
      required: true
      schema:
        type: string
    EntryId:
      name: id
      in: path
      required: true
      schema:
        type: string
    RecurringTransactionId:
      name: id
      in: path
      required: true
      schema:
        type: string
    ShareUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string

  schemas:
    User:
      type: object
      required: [id, email, is_admin, created_at, language]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        is_admin:
          type: boolean
        created_at:
          type: string
          format: date-time
        language:
          type: string
          nullable: true
          description: >-
            The account's raw, unresolved language preference, or null when
            none is set — used by the client to prioritize it over browser
            detection (see the web-client-i18n capability). Distinct from
            GET /api/settings, whose language field is always resolved to a
            default when unset.
          enum: [en, de]

    AdminUser:
      type: object
      required: [id, email, is_admin, disabled, created_at]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        is_admin:
          type: boolean
        disabled:
          type: boolean
        created_at:
          type: string
          format: date-time

    RecurringPreviewHorizon:
      type: string
      enum:
        [
          1_month,
          2_months,
          3_months,
          end_of_this_month,
          end_of_next_month,
          end_of_this_year,
        ]
      description: >-
        How far ahead a caller's recurring-preview toggle projects, resolved
        to a concrete date client-side — the backend never interprets this
        value itself.

    UserSettings:
      type: object
      additionalProperties: false
      required:
        [
          language,
          timezone,
          default_currency,
          displayed_decimal_places,
