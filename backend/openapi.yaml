      description: >-
        Two shareable tiers, each a strict superset of the one before it:
        view (the tag resolves in entry-list filters and on entries already
        carrying it, but cannot be newly selected), append (+ selectable
        when tagging an entry). owner is the real owner's own, implicit
        permission — never a valid value for a share; only the real owner
        may ever rename, disable/enable, or delete a tag, or manage its
        shares.

    TagShare:
      type: object
      required:
        - user_id
        - name
        - email
        - permission
        - granted_by
        - granted_by_name
        - created_at
        - updated_at
      properties:
        user_id:
          type: string
        name:
          type: string
        email:
          type: string
        permission:
          $ref: '#/components/schemas/TagPermission'
        granted_by:
          type: string
        granted_by_name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TagShareInvite:
      type: object
      required: [email, permission]
      properties:
        email:
          type: string
        permission:
          $ref: '#/components/schemas/TagPermission'

    TagShareInviteResult:
      type: object
      required: [matched, invite_allowed]
      properties:
        matched:
          type: boolean
          description: >-
            True when email matched an existing, active user and a share
            was created or updated (share is then present). False when no
            such user exists.
        invite_allowed:
          type: boolean
          description: >-
            Only meaningful when matched is false: whether the instance
            currently allows sending a new application invite for this
            email (mirrors POST /api/auth/invites' own gating).
        share:
          $ref: '#/components/schemas/TagShare'

    TagSharePermissionUpdate:
      type: object
      required: [permission]
      properties:
        permission:
          $ref: '#/components/schemas/TagPermission'

    TagWrite:
      type: object
      required: [name]
      properties:
        name:
          type: string

    EntryKind:
      type: string
      enum: [transaction, balance_adjustment, self_transfer]

    Entry:
      type: object
      required:
        - id
        - account_id
        - kind
        - amount
        - booking_timestamp
        - title
        - tag_ids
        - created_at
        - updated_at
        - created_by
      properties:
        id:
          type: string
        account_id:
          type: string
        account_currency:
          type: string
          description: >-
            The currency of account_id, resolved server-side regardless of
            whether the caller currently holds any account-level access to
            that account — the same resolve-it-server-side precedent
            created_by_name establishes below, so amount can always be
            rendered correctly without a separate account fetch. This
            matters for an entry the caller can see only via a category
            permission with no account-level access at all (see
            category-sharing, entry-categories): account_currency is the
            one piece of that account's data carried onto the entry, every
            other detail (name, balance, other entries) stays unexposed.
        to_account_id:
          type: string
          nullable: true
          description: >-
            The receiving account of a self_transfer — present only when
            kind is self_transfer, null otherwise. Fixed at creation, never
            individually reassigned afterward (see account-entries).
        to_account_name:
          type: string
          description: >-
            to_account_id's title, resolved server-side regardless of the
            caller's own permission on that account — present only when
            kind is self_transfer, the same reasoning account_currency
            already follows for account_id.
        to_account_currency:
          type: string
          description: >-
            to_account_id's currency, resolved the same unconditional way
            as to_account_name — always equal to account_currency, since a
            self_transfer requires both accounts to share a currency.
        kind:
          $ref: "#/components/schemas/EntryKind"
        amount:
          type: integer
          format: int64
          description: >-
            Integer minor units at a fixed 4 decimal places (e.g. 105000
            represents 10.5000 in the account's currency). Not
            configurable — see account-entries. Always a signed delta
            applied to the account's running balance: for a transaction or
            self_transfer, exactly what was submitted (a self_transfer's
            amount is signed from account_id's perspective — the receiving
            account, to_account_id, effectively sees -amount); for a
            balance_adjustment, computed automatically as the change from
            the balance immediately before it — never client-supplied for
            that kind. When a self_transfer is listed once per account it
            touches (see GET /api/entries), the amount returned for the
            to_account_id-side occurrence is that negated value, and its
            account_id/to_account_id are swapped accordingly.
        balance:
          type: integer
          format: int64
          nullable: true
          description: >-
            The absolute reading a balance_adjustment's amount is computed
            against — present only when kind is balance_adjustment, null
            for a transaction. This is what the client supplies when
            creating or editing a balance_adjustment (see EntryCreate/
            EntryUpdate), at the same 4-decimal-place scale as amount.
        booking_timestamp:
          type: string
          format: date-time
        title:
          type: string
        description:
          type: string
        category_id:
          type: string
          description: >-
            Required for a transaction, optional for a balance_adjustment
            or self_transfer.
        counterparty:
          type: string
          description: >-
            The other party in the transaction (who was paid, or who paid)
            — accepted only when kind is transaction, rejected (400) on a
            balance_adjustment or self_transfer. Suggested values for
            client autocomplete come from GET /api/entries/counterparties.
        location:
          type: string
          description: >-
            A free-text location — accepted only when kind is transaction,
            rejected (400) on a balance_adjustment or self_transfer. Never
            parsed or validated by the backend: it may hold a typed
            address, or a JSON string `{"lat":<number>,"lng":<number>}`
            produced by device GPS or a map pin, at the client's
            discretion.
        tag_ids:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
          description: >-
            The id of the user who logged this entry — immutable after
            creation, not necessarily the account's real owner once it has
            been shared (see account-sharing).
        created_by_name:
          type: string
          description: >-
            The creator's display name (or email, as a fallback), resolved
            server-side so a viewer can see who logged an entry without a
            separate lookup.
        recurring_transaction_id:
          type: string
          nullable: true
          description: >-
            The recurring transaction this entry was created from or has
            been linked to, or null. Always on the same account_id as this
            entry.

    EntryCreate:
      type: object
      required: [account_id, kind, booking_timestamp, title]
      description: >-
        amount is required when kind is transaction or self_transfer and
        rejected when kind is balance_adjustment; balance is required when
        kind is balance_adjustment and rejected otherwise — exactly one of
        the two, per kind (400). counterparty and location are accepted
        only when kind is transaction, rejected (400) otherwise.
        to_account_id is required when kind is self_transfer and rejected
        otherwise (400); it must differ from account_id and name an account
        the caller holds append+ permission on, sharing account_id's
        currency (400 otherwise) — the same rules account_id itself must
        already satisfy — and that is not disabled (422).
      properties:
        account_id:
          type: string
        to_account_id:
          type: string
          description: >-
            Required for kind=self_transfer (the receiving account); must
            be omitted otherwise.
        kind:
          $ref: "#/components/schemas/EntryKind"
        amount:
          type: integer
          format: int64
          description: >-
            Required for kind=transaction or kind=self_transfer; must be
            omitted otherwise.
        balance:
          type: integer
          format: int64
          description: Required for kind=balance_adjustment; must be omitted otherwise.
        booking_timestamp:
          type: string
          format: date-time
        title:
          type: string
        description:
          type: string
        category_id:
          type: string
        counterparty:
          type: string
          description: Accepted only for kind=transaction; must be omitted otherwise.
        location:
          type: string
          description: Accepted only for kind=transaction; must be omitted otherwise.
        tag_ids:
          type: array
          items:
            type: string
        recurring_transaction_id:
          type: string
          description: >-
            Must name a recurring transaction on the same account_id as
            account_id above.

    EntryUpdate:
      type: object
      description: >-
        No kind field — it is immutable after creation; no to_account_id
        field either — a self_transfer's two accounts are fixed at
        creation. account_id may be set to move the entry to a different
        account the caller owns (see account-entries); it must not be
        disabled, the same rule creation applies — rejected outright (422)
        when the entry's kind is self_transfer. No currency conversion or
        validation is performed. amount is only settable when the entry's
        kind is transaction or self_transfer, balance only when it is
        balance_adjustment — supplying the other one is rejected (400).
        counterparty and location are likewise only settable when the
        entry's kind is transaction (400 otherwise); an empty string
        clears either field. Editing a self_transfer additionally requires
        the caller to currently hold append+ permission on both its
        accounts (403 otherwise), regardless of which fields are being
        changed — see account-entries.
      properties:
        account_id:
          type: string
        amount:
          type: integer
          format: int64
        balance:
          type: integer
          format: int64
        booking_timestamp:
          type: string
          format: date-time
        title:
          type: string
        description:
          type: string
        counterparty:
          type: string
        location:
          type: string
        category_id:
          type: string
          nullable: true
          description: >-
            Explicit null clears it (only valid when the entry's kind is
            balance_adjustment).
        tag_ids:
          type: array
          items:
            type: string
          description: Replaces the full set, including clearing it with [].
        recurring_transaction_id:
          type: string
          nullable: true
          description: >-
            Must name a recurring transaction on the same account_id as this
            entry (its current one, or the account_id also set in this same
            request). Explicit null clears the link.

    EntryConvertToSelfTransfer:
      type: object
      required: [to_account_id, original_account_role]
      description: >-
        Request body for POST /api/entries/{id}/self-transfer — see that
        operation's description for the full carry-over and authorization
        rules.
      properties:
        to_account_id:
          type: string
          description: >-
            The counterparty account. Must differ from the entry's own
            account_id, share its currency, and be one the caller holds
            append+ permission on and that is not disabled.
        original_account_role:
          type: string
          enum: [sender, receiver]
          description: >-
            Which role the entry's own account plays in the resulting
            self-transfer. "sender": the entry's own account keeps
            account_id, amount unchanged, to_account_id gets to_account_id
            above; recurring_transaction_id carries over. "receiver": the
            entry's own account becomes to_account_id, to_account_id above
            becomes account_id, amount is negated so the entry's own
            account's real economic effect is unchanged; any
            recurring_transaction_id is dropped rather than carried over.

    EntryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Entry"
        next_cursor:
          type: string
          nullable: true

    Balance:
      type: object
      required: [balance]
      properties:
        balance:
          type: integer
          format: int64

    CurrencySum:
      type: object
      required: [currency, amount]
      properties:
        currency:
          type: string
        amount:
          type: integer
          format: int64

    EntrySummary:
      type: object
      required: [sums, count]
      properties:
        sums:
          type: array
          items:
            $ref: "#/components/schemas/CurrencySum"
        count:
          type: integer
          format: int64

    IntervalUnit:
      type: string
      enum: [day, week, month, year]
      description: >-
        Combined with interval_count to mean "every interval_count
        interval_units" — there is no separate named frequency value.
        Quarterly is interval_unit=month, interval_count=3; yearly is
        interval_unit=year, interval_count=1.

    RecurringTransaction:
      type: object
      required:
        - id
        - account_id
        - title
        - category_id
        - amount
        - interval_unit
        - interval_count
        - starts_on
        - tag_ids
        - created_at
        - updated_at
        - created_by
        - per_year_amount
        - ended
        - next_suggested_date
        - linked_entry_count
      properties:
        id:
          type: string
        account_id:
          type: string
        account_currency:
          type: string
          description: >-
            The currency of account_id, resolved server-side — mirrors
            Entry's account_currency.
        title:
          type: string
        description:
          type: string
        category_id:
          type: string
        counterparty:
          type: string
        location:
          type: string
        tag_ids:
          type: array
          items:
            type: string
        amount:
          type: integer
          format: int64
          description: >-
            The signed amount at the same fixed 4-decimal-place scale as an
            Entry's amount — what is booked each occurrence, before the
            per_year_amount multiplier.
        interval_unit:
          $ref: "#/components/schemas/IntervalUnit"
        interval_count:
          type: integer
          description: Positive integer — "every interval_count interval_units".
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
        created_by_name:
          type: string
        per_year_amount:
          type: integer
          format: int64
          description: >-
            Computed server-side from amount and the recurrence rule, never
            stored: 12/interval_count for month, 1/interval_count for year
            (both exact), 365.25/(7*interval_count) for week, and
            365.25/interval_count for day.
        ended:
          type: boolean
          description: >-
            True when ends_on is at or before the current date, in the
            caller's resolved timezone. Never blocks reads or writes — only
            affects this flag and exclusion from
            GET /api/recurring-transactions/summary's total.
        next_suggested_date:
          type: string
          format: date
          description: >-
            Computed server-side, never stored: the latest non-deleted
            linked entry's booking_timestamp advanced by one recurrence
            interval, or starts_on when there is no linked entry yet.
        linked_entry_count:
          type: integer
          description: >-
            The number of non-deleted entries currently linked to this
            recurring transaction, computed server-side. A non-zero value
            means DELETE will be rejected (409) until every linked entry
            is unlinked.

    RecurringTransactionPreviewItem:
      type: object
      description: >-
        One projected future occurrence of a recurring transaction — never
        persisted, carries no id.
      required:
        - recurring_transaction_id
        - account_id
        - title
        - tag_ids
        - amount
        - booking_timestamp
        - overdue
      properties:
        recurring_transaction_id:
          type: string
        account_id:
          type: string
        account_currency:
          type: string
        title:
          type: string
        description:
          type: string
        category_id:
          type: string
        counterparty:
          type: string
        location:
          type: string
        tag_ids:
          type: array
          items:
            type: string
        amount:
          type: integer
          format: int64
        booking_timestamp:
          type: string
          format: date
          description: The projected date of this occurrence.
        overdue:
          type: boolean
          description: >-
            True when booking_timestamp is before the current date, in the
            caller's resolved timezone.

    RecurringTransactionCreate:
      type: object
      required:
        - account_id
        - title
        - category_id
        - amount
        - interval_unit
        - interval_count
        - starts_on
      properties:
        account_id:
          type: string
        title:
          type: string
        description:
          type: string
        category_id:
          type: string
        counterparty:
          type: string
        location:
          type: string
        tag_ids:
          type: array
          items:
            type: string
        amount:
          type: integer
          format: int64
        interval_unit:
          $ref: "#/components/schemas/IntervalUnit"
        interval_count:
          type: integer
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
          description: Must not be before starts_on.

    RecurringTransactionUpdate:
      type: object
      properties:
        account_id:
          type: string
        title:
          type: string
        description:
          type: string
        category_id:
          type: string
        counterparty:
          type: string
        location:
          type: string
        tag_ids:
          type: array
          items:
            type: string
        amount:
          type: integer
          format: int64
        interval_unit:
          $ref: "#/components/schemas/IntervalUnit"
        interval_count:
          type: integer
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
          nullable: true
          description: Explicit null clears it.

    FlowBucket:
      type: object
      required: [period, income, outcome]
      description: >-
        One period's income/outcome totals — see
        GET /api/entries/flow-summary. A currency with only income (or only
        outcome) entries in this period appears in just that one array,
        never also in the other with an amount of 0.
      properties:
        period:
          type: string
          format: date
          description: >-
            The bucket's first calendar day (YYYY-MM-DD), regardless of
            unit — a day-unit bucket is just a single day.
        income:
          type: array
          items:
            $ref: "#/components/schemas/CurrencySum"
        outcome:
          type: array
          items:
            $ref: "#/components/schemas/CurrencySum"

    DashboardCardType:
      type: string
      enum: [account_stat, query_stat, entry_list, bar_chart, line_chart]
      description: >-
        Immutable after creation. account_stat: one account's live
        balance. query_stat: a per-currency sum for an inline filter.
        entry_list: the 10 most recent entries matching an inline filter.
        bar_chart: an income/outcome bar chart for an account or an
        inline-filtered query. line_chart: a running-balance line chart
        for an account or every account.

    DashboardCardConfig:
      type: object
      description: >-
        A plain object whose meaningful fields depend on the card's type
        (see DashboardCardType) — not a discriminated union at the schema
        level; the backend validates the required/allowed field set per
        type. account_id/category_id/tag_id, when present, must each name
        an entity the caller has at least view permission on. range (on
        query_stat/entry_list) is never interpreted server-side — it is
        resolved to concrete from/to timestamps by the client at render
        time, the same way /reports resolves its own date-range presets.
      properties:
        account_id:
          type: string
          description: >-
            Required on account_stat. Optional filter on query_stat/
            entry_list/bar_chart/line_chart (omitted means every account
            the caller can see).
        category_id:
          type: string
          description: Optional filter on query_stat/entry_list/bar_chart.
        include_subcategories:
          type: boolean
          description: >-
            Only meaningful alongside category_id. Absent means true (the
            default), mirroring /reports' own checkbox.
        tag_id:
          type: string
          description: Optional filter on query_stat/entry_list/bar_chart.
        range:
          type: object
          description: >-
            Only meaningful on query_stat/entry_list. Mirrors /reports'
            own filter shape.
          properties:
            preset:
              type: string
              description: >-
                A frontend-owned relative-range key (e.g. this_month),
                opaque to the backend.
            from:
              type: string
              format: date
            to:
              type: string
              format: date
        unit:
          type: string
          enum: [month, day]
          description: >-
            Required on bar_chart. month renders a year of monthly bars;
            day renders a month of daily bars.
        columns:
          type: integer
          minimum: 2
          maximum: 4
          description: >-
            Only meaningful, and only settable, on entry_list — how many
            columns of the dashboard's responsive grid the card spans.
            Absent means 2 (the minimum). account_stat/query_stat always
            occupy exactly one column and bar_chart/line_chart are always
            full width, neither configurable.
        title:
          type: string
          description: >-
            Optional custom heading, settable on query_stat/entry_list/
            bar_chart/line_chart only (never account_stat, whose heading
            is always its account's own name). The web client renders it
            — falling back to a generated summary of the filter when
            absent — as a link through to /reports with this card's
            account/category/tag/date-range filter prefilled.
        show_recurring_preview:
          type: boolean
          description: >-
            Only meaningful, and only settable, on entry_list/bar_chart/
            line_chart. Absent means false. When true, the card
            additionally previews upcoming recurring-transaction
            occurrences (an Upcoming block on entry_list; stacked
            projected bar segments on bar_chart; a projected balance line
            on line_chart) via GET /api/recurring-transactions/preview,
            bounded by the caller's recurring_preview_horizon setting.

    DashboardCard:
      type: object
      required: [id, type, config, sort_order]
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/DashboardCardType"
        config:
          $ref: "#/components/schemas/DashboardCardConfig"
        sort_order:
          type: integer
          description: Meaningful only among the caller's own cards.

    DashboardCardCreate:
      type: object
      required: [type, config]
      properties:
        type:
          $ref: "#/components/schemas/DashboardCardType"
        config:
          $ref: "#/components/schemas/DashboardCardConfig"

    DashboardCardUpdate:
      type: object
      required: [config]
      properties:
        config:
          $ref: "#/components/schemas/DashboardCardConfig"

    BalancePoint:
      type: object
      required: [period, balances]
      description: >-
        One sample of the running account balance — see
        GET /api/entries/balance-series. balances lists one entry per
        currency present in the selected accounts, always including that
        currency even when its amount is 0.
      properties:
        period:
          type: string
          format: date
          description: >-
            The point's local calendar day (YYYY-MM-DD). The closing point
            is labelled with the first day of the following month.
        balances:
          type: array
          items:
            $ref: "#/components/schemas/CurrencySum"

security:
  - sessionCookie: []
  - bearerToken: []
