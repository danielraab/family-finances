            Display-only rounding preference — never affects how an amount
            is stored or edited (see account-entries' fixed 4-decimal-place
            storage).
        week_start:
          type: string
          enum: [monday, sunday]
          description: >-
            Which day a week starts on, used to anchor week-based
            date-range presets on the client.
        recurring_preview_horizon:
          $ref: "#/components/schemas/RecurringPreviewHorizon"

    UserSettingsUpdate:
