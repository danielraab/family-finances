            when unset.
        color:
          type: string
          pattern: ^[a-z0-9-]{1,40}$
          description: >-
            Optional opaque presentation token naming a client colour.
            Stored and echoed verbatim; never interpreted by the backend.
            Absent when unset.
        sort_order:
          type: integer
          description: >-
            Meaningful only among siblings sharing the same parent_id.
        disabled:
          type: boolean
          description: >-
            Blocks the category from being newly selected on an entry;
            existing entries and child categories referencing it are
            unaffected.
        created_at:
          type: string
          format: date-time
        entry_count:
          type: integer
          description: >-
            The number of the *viewing caller's own* non-deleted entries
            directly categorized under this category. Direct references
            only — entries under a descendant category are not counted.
        permission:
          $ref: '#/components/schemas/CategoryPermission'
        shared:
          type: boolean
          description: >-
            True when the caller is not this category's real owner (i.e.
            they hold it via a share). Never true for the real owner's own
            view of their own category.
        owner_name:
          type: string
          description: >-
            The real owner's display name (or email, as a fallback). Present
