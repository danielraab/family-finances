openapi: 3.0.3

info:
  title: family-finances API
  version: 0.1.0
  description: >-
    The JSON HTTP API of the family-finances backend. This document is
    hand-written and is the source of truth for the API surface (see
    openapi/README.md). Operations tagged `browser-flow` and marked
    `x-internal: true` are browser-navigation redirects, not part of the
    generated typed client.

servers:
  - url: /
    description: Same-origin — the Go backend serves both the API and the SPA.

tags:
  - name: health
    description: Liveness / readiness.
  - name: auth
    description: >-
      Sign-in, session, and invites — including the admin-only user and
      invitation administration endpoints.
  - name: settings
    description: >-
      Per-user preferences (language, timezone, default currency, displayed
      decimal places).
  - name: accounts
    description: >-
      Bookkeeping accounts, each owned by exactly one user. An account's
      type is a free-text label stored on the account itself.
  - name: categories
    description: The caller's own tree-structured category lookup.
  - name: tags
    description: Per-user tags, private to their owner.
  - name: entries
    description: >-
      Transactions and balance adjustments recorded against an account,
      including live balance computation and a filterable/searchable/
      sortable, cursor-paginated listing.
  - name: browser-flow
    description: >-
      Endpoints a browser reaches by full-page navigation, not fetch. Documented
      for completeness; excluded from the generated client.
  - name: meta
    description: The API describing itself.

paths:
  /api/healthz:
    get:
      operationId: getHealthz
      summary: Readiness probe — pings the database
      tags: [health]
      security: []
      responses:
        "200":
          description: The database answered a bounded ping.
          content:
            text/plain:
              schema:
                type: string
              example: ok
        "503":
          description: No database is configured or it did not answer.
          content:
            text/plain:
              schema:
                type: string

  /api/openapi.yaml:
    get:
      operationId: getOpenAPIDocument
      summary: This OpenAPI document
      tags: [meta]
      security: []
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string

  /api/auth/config:
    get:
      operationId: getAuthConfig
      summary: Sign-in methods the client should offer
      description: >-
        Unauthenticated. Reports the sign-in affordances the web client should
        render on the login page. Exposes no provider secrets.
      tags: [auth]
      security: []
      responses:
        "200":
          description: The available sign-in affordances.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"

  /api/auth/me:
    get:
      operationId: getAuthMe
      summary: The authenticated user
      tags: [auth]
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/logout:
    post:
      operationId: postAuthLogout
      summary: Revoke the current session
      tags: [auth]
      responses:
        "204":
          description: Session revoked. For a browser the ff_session cookie is cleared.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/email/start:
    post:
      operationId: postAuthEmailStart
      summary: Start a magic-link sign-in
      description: >-
        Always returns 200 regardless of whether an account exists or a mail was
        sent, to prevent account enumeration.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailStartRequest"
      responses:
        "200":
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOk"
        "400":
          description: Malformed request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/invites:
    post:
      operationId: postAuthInvites
      summary: Invite an email address
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
      responses:
        "201":
          description: Invite created and an acceptance email sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "400":
          description: Malformed request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Inviting is disabled on this instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: getAuthInvites
      summary: List every invitation (admin only)
      description: >-
        Every non-soft-deleted invite regardless of status (pending,
        accepted, expired, or revoked), newest first, each carrying the
        inviter's identity.
      tags: [auth]
      responses:
        "200":
          description: Every invitation.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/auth/invites/mine:
    get:
      operationId: getAuthInvitesMine
      summary: List the authenticated user's own invitations
      description: >-
        Every non-soft-deleted invite the caller personally created,
        regardless of status. No admin requirement.
      tags: [auth]
      responses:
        "200":
          description: The caller's own invitations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/invites/{id}/revoke:
    post:
      operationId: postAuthInviteRevoke
      summary: Revoke an invitation
      description: >-
        Permitted for the invite's own inviter or an admin. Idempotent — a
        repeat call on an already-revoked invite succeeds without changing
        its revoked_at. Permitted regardless of the invite's current status;
        a revoked invite stays visible in every listing.
      tags: [auth]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The invitation, now revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            The caller neither created this invitation nor is an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such invitation (or it has been soft-deleted).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/invites/{id}:
    delete:
      operationId: deleteAuthInvite
      summary: Soft-delete a revoked invitation (admin only)
      description: >-
        Rejected with 409 unless the invitation has already been revoked.
        One-way — there is no undelete endpoint. A soft-deleted invitation
        is excluded from both invitation listings.
      tags: [auth]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The invitation is soft-deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such invitation (or it is already soft-deleted).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/auth/users:
    get:
      operationId: getAuthUsers
      summary: List every non-deleted user (admin only)
      tags: [auth]
      responses:
        "200":
          description: Every non-soft-deleted user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/auth/users/{id}/disable:
    post:
      operationId: postAuthUserDisable
      summary: Disable a user and revoke their sessions immediately (admin only)
      description: >-
        No check prevents an admin from disabling their own account, including
        as the only remaining admin.
      tags: [auth]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The user, now disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/users/{id}/enable:
    post:
      operationId: postAuthUserEnable
      summary: Re-enable a disabled user (admin only)
      description: Does not restore any session revoked while disabled.
      tags: [auth]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The user, now enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/users/{id}:
    delete:
      operationId: deleteAuthUser
      summary: Soft-delete a user and revoke their sessions immediately (admin only)
      description: >-
        One-way in this API — there is no undelete endpoint. No check
        prevents an admin from deleting their own account, including as the
        only remaining admin.
      tags: [auth]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The user is soft-deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/settings:
    get:
      operationId: getSettings
      summary: The authenticated user's resolved settings
      description: >-
        Always fully populated — a field never set by the user resolves to
        its hardcoded application default.
      tags: [settings]
      responses:
        "200":
          description: The resolved settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: putSettings
      summary: Update one or more of the authenticated user's settings
      description: >-
        Partial update: only the fields present in the body are changed.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSettingsUpdate"
      responses:
        "200":
          description: The resolved settings after the update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
        "400":
          description: A field included in the body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/accounts:
    get:
      operationId: getAccounts
      summary: List the caller's accounts
      tags: [accounts]
      responses:
        "200":
          description: Every non-deleted account the caller owns.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: postAccounts
      summary: Create an account
      description: 422 when `type` is empty or only whitespace.
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreate"
      responses:
        "201":
          description: The created account, owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/accounts/{id}:
    get:
      operationId: getAccount
      summary: Get an account
      description: >-
        404 for an account the caller does not own, identical to a
        nonexistent one — existence is not disclosed across owners.
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchAccount
      summary: Update an account
      description: >-
        422 when `type` is present but empty or only whitespace. A shared
        `owner`-tier caller may change `type` like any other field.
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: deleteAccount
      summary: Soft-delete an account
      description: One-way — there is no undelete endpoint.
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "204":
          description: The account is soft-deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/accounts/{id}/disable:
    post:
      operationId: postAccountDisable
      summary: Disable an account
      description: >-
        Reversible via enable. Blocks creating new entries against the
        account; does not hide it or affect its existing entries.
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: The account, now disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/accounts/{id}/enable:
    post:
      operationId: postAccountEnable
      summary: Re-enable a disabled account
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: The account, now enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/accounts/{id}/shares:
    get:
      operationId: getAccountShares
      summary: List an account's shares
      description: >-
        Visible to any caller holding at least view permission (real
        ownership or any share) — every user with access to an account can
        see who else has access. Does not include the real owner as a row
        (their identity is on the Account itself via owner_name); a
        client renders that as the fixed first row separately.
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: Every current share on the account.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountShare"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: postAccountShare
      summary: Share an account with a user by email
      description: >-
        Owner-tier only (real owner or a shared owner). Unlike
        authentication's anti-enumeration endpoints, this deliberately does
        not hide whether email matched a registered user — the caller
        already holds an authenticated, owner-tier grant on a real account.
        A match creates or updates (200-201, share overwrites any existing
        one for that user in place) a share and emails the recipient a
        notification with an application link. No match returns 200 with
        matched: false and invite_allowed reflecting whether the instance
        currently permits sending a new application invite for that email;
        no share is created. Sharing with the caller's own email or the
        account's real owner's email is rejected (400).
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountShareInvite"
      responses:
        "200":
          description: No user matched that email; see invite_allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountShareInviteResult"
        "201":
          description: The share was created or updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountShareInviteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/accounts/{id}/shares/{userId}:
    patch:
      operationId: patchAccountShare
      summary: Change a share's permission
      description: >-
        Owner-tier only. The real owner can never be a target (400) — they
        carry no share row to change.
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/ShareUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountSharePermissionUpdate"
      responses:
        "200":
          description: The updated share.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountShare"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAccountShare
      summary: Revoke a share, or leave a shared account
      description: >-
        Owner-tier callers may target any user's share (revoke). Any user
        may target their own (userId equal to the caller's own id) —
        self-leave, requiring no owner-tier permission of its own. Either
        way access is removed immediately and unconditionally (no soft
        delete); entries the removed user created remain on the account,
        attributed to them, for every remaining permission holder. The
        real owner can never be a target (400) — they carry no share row,
        so self-leave is unavailable to them.
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/ShareUserId"
      responses:
        "204":
          description: The share is removed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/accounts/{id}/balance:
    get:
      operationId: getAccountBalance
      summary: The account's live balance
      description: >-
        Always computed live, never cached — see the account-entries
        capability. Equals the latest non-deleted balance_adjustment at or
        before as_of (or 0 if none), plus every non-deleted transaction
        after it, up to as_of.
      tags: [entries]
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - name: as_of
          in: query
          required: false
          description: RFC3339 timestamp. Defaults to now.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: The computed balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/account-types:
    get:
      operationId: getAccountTypes
      summary: List the caller's distinct in-use account type labels
      description: >-
        The distinct, non-empty `type` values on the caller's own
        non-deleted accounts, trimmed, compared verbatim (case-sensitive),
        sorted case-insensitively ascending. For client autocomplete only;
        there is no endpoint to create, rename, disable, or delete a type
        — a type exists by being written on an account.
      tags: [accounts]
      responses:
        "200":
          description: The caller's distinct in-use type labels.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/categories:
    get:
      operationId: getCategories
      summary: List the caller's category tree
      tags: [categories]
      responses:
        "200":
          description: Every non-deleted category the caller owns, including its parent_id.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: postCategories
      summary: Create a category
      description: >-
        Appended to the end of its sibling group (same parent_id, or root if
        omitted).
      tags: [categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryWrite"
      responses:
        "201":
          description: The created category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/categories/{id}:
    patch:
      operationId: patchCategory
      summary: Update a category
      description: >-
        Reparenting onto the category itself or one of its own descendants
        is rejected with 422. A reparent is appended to the end of the new
        parent's sibling group.
      tags: [categories]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryWrite"
      responses:
        "200":
          description: The updated category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: deleteCategory
      summary: Delete a category
      description: >-
        A soft delete (irreversible — no undelete). 409 if it has a
        non-deleted child category or is referenced by a non-deleted entry —
        deletion is never cascaded.
      tags: [categories]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The category is deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/categories/{id}/disable:
    post:
      operationId: postCategoryDisable
      summary: Disable a category
      description: >-
        Reversible via enable. Blocks the category from being newly selected
        on an entry; does not affect any entry or child category already
        referencing it.
      tags: [categories]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The category, now disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/categories/{id}/enable:
    post:
      operationId: postCategoryEnable
      summary: Re-enable a disabled category
      tags: [categories]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The category, now enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/categories/{id}/move-up:
    post:
      operationId: postCategoryMoveUp
      summary: Move a category up among its siblings
      description: >-
        Swaps sort_order with the immediate previous sibling (same
        parent_id). A no-op — 200, order unchanged — if the category is
        already first among its siblings.
      tags: [categories]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The category, with its updated (or unchanged) sort_order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/categories/{id}/move-down:
    post:
      operationId: postCategoryMoveDown
      summary: Move a category down among its siblings
      description: >-
        Swaps sort_order with the immediate next sibling (same parent_id). A
        no-op — 200, order unchanged — if the category is already last
        among its siblings.
      tags: [categories]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The category, with its updated (or unchanged) sort_order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/tags:
    get:
      operationId: getTags
      summary: List the caller's tags
      tags: [tags]
      responses:
        "200":
          description: Every tag the caller owns.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: postTags
      summary: Create a tag
      tags: [tags]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagWrite"
      responses:
        "201":
          description: The created tag, owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The caller already has a tag with this name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/tags/{id}:
    patch:
      operationId: patchTag
      summary: Rename a tag
      tags: [tags]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagWrite"
      responses:
        "200":
          description: The updated tag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The caller already has a tag with this name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteTag
      summary: Delete a tag
      description: >-
        Always allowed — detaches the tag from every entry it was attached
        to rather than being blocked by use, unlike a category or account
        type.
      tags: [tags]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The tag is deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/tags/{id}/disable:
    post:
      operationId: postTagDisable
      summary: Disable a tag
      description: >-
        Reversible via enable. Blocks the tag from being newly attached to
        an entry; does not affect any entry already carrying it.
      tags: [tags]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The tag, now disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/tags/{id}/enable:
    post:
      operationId: postTagEnable
      summary: Re-enable a disabled tag
      tags: [tags]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The tag, now enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/entries:
    get:
      operationId: getEntries
      summary: List the caller's entries, filtered/searched/sorted, cursor-paginated
      tags: [entries]
      parameters:
        - name: account_id
          in: query
          required: false
          description: Repeatable. Omitted means every account the caller owns.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: category_id
          in: query
          required: false
          description: >-
            Matches this category, plus every descendant unless
            category_mode=exact.
          schema:
            type: string
        - name: category_mode
          in: query
          required: false
          description: >-
            Only meaningful together with category_id. subtree (the
            default) matches the category and every descendant; exact
            matches only that category.
          schema:
            type: string
            enum: [subtree, exact]
            default: subtree
        - name: tag_id
          in: query
          required: false
          schema:
            type: string
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EntryKind"
        - name: from
          in: query
          required: false
          description: Inclusive booking_timestamp lower bound, RFC3339.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Inclusive booking_timestamp upper bound, RFC3339.
          schema:
            type: string
            format: date-time
        - name: q
          in: query
          required: false
          description: Case-insensitive substring match against title or description.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [booking_timestamp, amount]
            default: booking_timestamp
        - name: dir
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: after
          in: query
          required: false
          description: Opaque cursor from a previous response's next_cursor.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: A page of matching entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: postEntries
      summary: Create an entry
      description: >-
        422 when account_id does not name an account the caller owns, or
        names a disabled account.
      tags: [entries]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryCreate"
      responses:
        "201":
          description: The created entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/entries/summary:
    get:
      operationId: getEntriesSummary
      summary: Sum the caller's matching entries per currency, without paging
      description: >-
        Accepts the same account_id, category_id/category_mode, tag_id,
        from/to, and q filters as GET /api/entries (no sort, dir, after, or
        limit — this is an aggregate, not a page). Always additionally
        restricted to kind=transaction, regardless of the caller's other
        filters — a balance_adjustment is an absolute reading, not a
        categorized delta. Computed directly rather than by paging through
        results, so it is accurate however many entries match.
      tags: [entries]
      parameters:
        - name: account_id
          in: query
          required: false
          description: Repeatable. Omitted means every account the caller owns.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: category_id
          in: query
          required: false
          description: >-
            Matches this category, plus every descendant unless
            category_mode=exact.
          schema:
            type: string
        - name: category_mode
          in: query
          required: false
          schema:
            type: string
            enum: [subtree, exact]
            default: subtree
        - name: tag_id
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Inclusive booking_timestamp lower bound, RFC3339.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Inclusive booking_timestamp upper bound, RFC3339.
          schema:
            type: string
            format: date-time
        - name: q
          in: query
          required: false
          description: Case-insensitive substring match against title or description.
          schema:
            type: string
      responses:
        "200":
          description: The matching transaction entries' amounts, summed per currency.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntrySummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/entries/flow-summary:
    get:
      operationId: getEntriesFlowSummary
      summary: >-
        Bucket the caller's matching entries into per-month or per-day
        income/outcome totals
      description: >-
        Buckets the caller's own, non-deleted accounts' non-deleted entries
        by booking_timestamp — one bucket per calendar month of year when
        unit=month, or one bucket per calendar day of year/month when
        unit=day — using the caller's resolved timezone setting (see
        user-settings) to decide bucket boundaries, default UTC. Within
        each bucket, entries whose amount is positive are summed into
        income and the absolute value of entries whose amount is negative
        into outcome, grouped per currency (the currency of the entry's
        account) the same way GET /api/entries/summary groups its sum.
        Unlike GET /api/entries/summary, a balance_adjustment's amount
        (always a signed delta — see account-entries) is included, not
        excluded. Every period in the requested range is present, even one
        with no matching entries at all (empty income/outcome).
      tags: [entries]
      parameters:
        - name: account_id
          in: query
          required: false
          description: Repeatable. Omitted means every account the caller owns.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: unit
          in: query
          required: true
          schema:
            type: string
            enum: [month, day]
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: month
          in: query
          required: false
          description: 1-12. Required when unit=day, rejected when unit=month.
          schema:
            type: integer
      responses:
        "200":
          description: One bucket per period in the requested range.
          content:
            application/json:
              schema:
                type: object
                required: [buckets]
                properties:
                  buckets:
                    type: array
                    items:
                      $ref: "#/components/schemas/FlowBucket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/entries/balance-series:
    get:
      operationId: getEntriesBalanceSeries
      summary: The caller's running account balance sampled per day over a month
      description: >-
        Returns the running balance of the caller's own, non-deleted
        accounts sampled at each local midnight of year/month — one point at
        00:00 on every calendar day of the month, plus a closing point at
        00:00 on the first day of the following month — using the caller's
        resolved timezone setting (see user-settings) to place those
        midnight boundaries, default UTC. Each point's value is the balance
        computed exactly as GET /api/accounts/{id}/balance computes it as of
        that instant (a balance_adjustment acts as an anchor), grouped per
        currency (the currency of the contributing accounts); accounts
        sharing a currency are summed. Every currency present in the
        selected accounts appears on every point, including with an amount
        of 0 — unlike flow-summary, a balance line needs a value at every
        point. A month with no activity is a run of identical points.
        Unlike GET /api/entries and GET /api/entries/summary, this operation
        accepts no category_id, category_mode, tag_id, from, to, or q — a
        category- or tag-filtered "balance" is not a balance, since a
        balance_adjustment carries neither; supplying any of them is a 400.
      tags: [entries]
      parameters:
        - name: account_id
          in: query
          required: false
          description: Repeatable. Omitted means every account the caller owns.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: unit
          in: query
          required: true
          description: Only "day" is defined.
          schema:
            type: string
            enum: [day]
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: month
          in: query
          required: true
          description: 1-12.
          schema:
            type: integer
      responses:
        "200":
          description: One point per day of the requested month, plus a closing point.
          content:
            application/json:
              schema:
                type: object
                required: [points]
                properties:
                  points:
                    type: array
                    items:
                      $ref: "#/components/schemas/BalancePoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/entries/{id}:
    get:
      operationId: getEntry
      summary: Get an entry
      tags: [entries]
      parameters:
        - $ref: "#/components/parameters/EntryId"
      responses:
        "200":
          description: The entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchEntry
      summary: Update an entry
      description: >-
        kind is immutable — there is no field for it on this request body.
        account_id may be changed to move the entry to a different account
        the caller owns; a disabled target account is rejected (422), the
        same as entry creation.
      tags: [entries]
      parameters:
        - $ref: "#/components/parameters/EntryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryUpdate"
      responses:
        "200":
          description: The updated entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: deleteEntry
      summary: Soft-delete an entry
      description: One-way — there is no undelete endpoint.
      tags: [entries]
      parameters:
        - $ref: "#/components/parameters/EntryId"
      responses:
        "204":
          description: The entry is soft-deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/auth/email/callback:
    get:
      operationId: getAuthEmailCallback
      summary: Complete a magic-link sign-in
      description: >-
        Browser clients get a 302 with the ff_session cookie set. A client
        sending `Accept: application/json` (or `?client=api`) instead gets 200
        with a session token in the body.
      tags: [browser-flow]
      x-internal: true
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Signed in; redirect to a safe in-app path.
        "400":
          description: The token is missing, invalid, expired, or already used.

  /api/auth/oidc/start:
    get:
      operationId: getAuthOidcStart
      summary: Begin the OIDC authorization-code flow
      tags: [browser-flow]
      x-internal: true
      security: []
      parameters:
        - name: redirect_to
          in: query
          required: false
          description: Safe same-origin relative path to return to after sign-in.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the identity provider.
        "404":
          description: OIDC is not configured on this instance.

  /api/auth/oidc/callback:
    get:
      operationId: getAuthOidcCallback
      summary: Complete the OIDC authorization-code flow
      description: >-
        Browser clients get a 302 with the ff_session cookie set. A client
        sending `Accept: application/json` instead gets 200 with a session token
        in the body.
      tags: [browser-flow]
      x-internal: true
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Signed in; redirect to a safe in-app path.
        "400":
          description: Missing/unknown state, provider error, or id_token verification failed.

  /api/auth/invites/accept:
    get:
      operationId: getAuthInvitesAccept
      summary: Accept an invite
      description: >-
        Browser clients get a 302 with the ff_session cookie set. A client
        sending `Accept: application/json` instead gets 200 with a session token
        in the body.
      tags: [browser-flow]
      x-internal: true
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Account created / signed in; redirect to a safe in-app path.
        "400":
          description: The invite token is missing, invalid, expired, or already used.

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ff_session
    bearerToken:
      type: http
      scheme: bearer

  responses:
    Unauthorized:
      description: No valid session was presented.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The authenticated user is not an admin.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The request conflicts with the resource's current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: >-
        No such resource — including one that belongs to a different owner,
        which behaves identically to nonexistent (existence is not
        disclosed across owners).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: A field in the request failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: >-
        The request is well-formed but violates a business rule (e.g. a
        reparent that would create a category cycle, or an entry against a
        disabled account).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  parameters:
    AccountId:
      name: id
      in: path
      required: true
      schema:
        type: string
    EntryId:
      name: id
      in: path
      required: true
      schema:
        type: string
    ShareUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string

  schemas:
    User:
      type: object
      required: [id, email, is_admin, created_at, language]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        is_admin:
          type: boolean
        created_at:
          type: string
          format: date-time
        language:
          type: string
          nullable: true
          description: >-
            The account's raw, unresolved language preference, or null when
            none is set — used by the client to prioritize it over browser
            detection (see the web-client-i18n capability). Distinct from
            GET /api/settings, whose language field is always resolved to a
            default when unset.
          enum: [en, de]

    AdminUser:
      type: object
      required: [id, email, is_admin, disabled, created_at]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        is_admin:
          type: boolean
        disabled:
          type: boolean
        created_at:
          type: string
          format: date-time

    UserSettings:
      type: object
      additionalProperties: false
      required: [language, timezone, default_currency, displayed_decimal_places]
      properties:
        language:
          type: string
          enum: [en, de]
        timezone:
          type: string
        default_currency:
          type: string
        displayed_decimal_places:
          type: integer
          minimum: 0
          maximum: 4
          description: >-
            Display-only rounding preference — never affects how an amount
            is stored or edited (see account-entries' fixed 4-decimal-place
            storage).

    UserSettingsUpdate:
      type: object
      additionalProperties: false
      properties:
        language:
          type: string
          enum: [en, de]
        timezone:
          type: string
        default_currency:
          type: string
        displayed_decimal_places:
          type: integer
          minimum: 0
          maximum: 4

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        request_id:
          type: string

    StatusOk:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    EmailStartRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    InviteRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    Invite:
      type: object
      required: [id, email, expires_at, invited_by, accepted_at, revoked_at]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        expires_at:
          type: string
          format: date-time
        invited_by:
          $ref: "#/components/schemas/InviteInviter"
        accepted_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Set once, by the invite's own inviter or an admin. Blocks
            acceptance but does not remove the invite from any listing.

    InviteInviter:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string

    OidcLogin:
      type: object
      additionalProperties: false
      required: [label, start_path]
      properties:
        label:
          type: string
        start_path:
          type: string

    AuthConfig:
      type: object
      additionalProperties: false
      required: [oidc]
      properties:
        oidc:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/OidcLogin"

    Account:
      type: object
      required:
        - id
        - title
        - type
        - currency
        - opening_date
        - disabled
        - created_at
        - updated_at
        - permission
        - shared
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        icon:
          type: string
          pattern: ^[a-z0-9-]{1,40}$
          description: >-
            Optional opaque presentation token naming a client icon. Stored
            and echoed verbatim; never interpreted by the backend. Absent
            when unset.
        color:
          type: string
          pattern: ^[a-z0-9-]{1,40}$
          description: >-
            Optional opaque presentation token naming a client colour.
            Stored and echoed verbatim; never interpreted by the backend.
            Absent when unset.
        type:
          type: string
          description: >-
            Free-text label (e.g. "Checking"). Trimmed of surrounding
            whitespace on write; otherwise stored verbatim, not case-folded
            or checked against any list. Never empty.
        currency:
          type: string
          description: ISO-4217 shape (three uppercase letters), not a canonical list.
        financial_institute:
          type: string
        opening_date:
          type: string
          format: date
        closing_date:
          type: string
          format: date
        disabled:
          type: boolean
          description: >-
            Reversible; blocks creating new entries against the account.
            Independent of closing_date (informational only) and of soft
            delete.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        permission:
          allOf:
            - $ref: '#/components/schemas/AccountPermission'
          description: >-
            The caller's own effective permission on this account — always
            "owner" for the real owner, never absent.
        shared:
          type: boolean
          description: >-
            True when the caller is not this account's real owner (i.e. they
            hold a share). Always false for the real owner, even when they
            have shared the account with others.
        owner_name:
          type: string
          description: >-
            The real owner's display name (or email, as a fallback). Present
            for every account, but only meaningful to render when shared is
            true.

    AccountCreate:
      type: object
      required: [title, type, currency, opening_date]
      properties:
        title:
          type: string
        description:
          type: string
        icon:
          type: string
          pattern: ^[a-z0-9-]{1,40}$
          description: Optional opaque client icon token; not interpreted by the backend.
        color:
          type: string
          pattern: ^[a-z0-9-]{1,40}$
          description: Optional opaque client colour token; not interpreted by the backend.
        type:
          type: string
          description: Free-text label; trimmed on write, never empty.
        currency:
          type: string
        financial_institute:
          type: string
        opening_date:
          type: string
          format: date
        closing_date:
          type: string
          format: date

    AccountUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        icon:
          type: string
          pattern: ^([a-z0-9-]{1,40})?$
          description: >-
            Optional opaque client icon token. An empty string clears it;
            omitting the field leaves it unchanged.
        color:
          type: string
          pattern: ^([a-z0-9-]{1,40})?$
          description: >-
            Optional opaque client colour token. An empty string clears it;
            omitting the field leaves it unchanged.
        type:
          type: string
          description: >-
            Free-text label; trimmed on write. When present it must be
            non-empty after trimming. Omitting the field leaves it
            unchanged.
        currency:
          type: string
        financial_institute:
          type: string
        opening_date:
          type: string
          format: date
        closing_date:
          type: string
          format: date
          nullable: true
          description: Explicit null clears it (re-opening the account).

    AccountPermission:
      type: string
      enum: [view, append, entry_admin, owner]
      description: >-
        Four tiers, each a strict superset of the one before it: view
        (read entries and balance), append (+ create entries, edit/delete
        only ones created by the same user), entry_admin (+ edit/delete any
        entry on the account), owner (+ edit account metadata,
        disable/enable/soft-delete the account, manage shares).

    AccountShare:
      type: object
      required:
        - user_id
        - name
        - email
        - permission
        - granted_by
        - granted_by_name
        - created_at
        - updated_at
      properties:
        user_id:
          type: string
        name:
          type: string
        email:
          type: string
        permission:
          $ref: '#/components/schemas/AccountPermission'
        granted_by:
          type: string
        granted_by_name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AccountShareInvite:
      type: object
      required: [email, permission]
      properties:
        email:
          type: string
        permission:
          $ref: '#/components/schemas/AccountPermission'

    AccountShareInviteResult:
      type: object
      required: [matched, invite_allowed]
      properties:
        matched:
          type: boolean
          description: >-
            True when email matched an existing, active user and a share
            was created or updated (share is then present). False when no
            such user exists — see design.md's deliberate,
            non-anti-enumeration decision for this endpoint.
        invite_allowed:
          type: boolean
          description: >-
            Only meaningful when matched is false: whether the instance
            currently allows sending a new application invite for this
            email (mirrors POST /api/auth/invites' own gating).
        share:
          $ref: '#/components/schemas/AccountShare'

    AccountSharePermissionUpdate:
      type: object
      required: [permission]
      properties:
        permission:
          $ref: '#/components/schemas/AccountPermission'

    Category:
      type: object
      required: [id, name, sort_order, disabled, created_at]
      properties:
        id:
          type: string
        parent_id:
          type: string
          description: Absent for a root category.
        name:
          type: string
        icon:
          type: string
          pattern: ^[a-z0-9-]{1,40}$
          description: >-
            Optional opaque presentation token naming a client icon. Stored
            and echoed verbatim; never interpreted by the backend. Absent
            when unset.
        color:
          type: string
          pattern: ^[a-z0-9-]{1,40}$
          description: >-
            Optional opaque presentation token naming a client colour.
            Stored and echoed verbatim; never interpreted by the backend.
            Absent when unset.
        sort_order:
          type: integer
          description: >-
            Meaningful only among siblings sharing the same parent_id.
        disabled:
          type: boolean
          description: >-
            Blocks the category from being newly selected on an entry;
            existing entries and child categories referencing it are
            unaffected.
        created_at:
          type: string
          format: date-time

    CategoryWrite:
      type: object
      properties:
        name:
          type: string
        icon:
          type: string
          pattern: ^([a-z0-9-]{1,40})?$
          description: >-
            Optional opaque client icon token. An empty string clears it;
            omitting the field leaves it unchanged.
        color:
          type: string
          pattern: ^([a-z0-9-]{1,40})?$
          description: >-
            Optional opaque client colour token. An empty string clears it;
            omitting the field leaves it unchanged.
        parent_id:
          type: string
          nullable: true
          description: Explicit null makes it a root category.

    Tag:
      type: object
      required: [id, name, disabled, created_at, entry_count]
      properties:
        id:
          type: string
        name:
          type: string
        disabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        entry_count:
          type: integer
          description: >-
            The number of the caller's own non-deleted entries currently
            carrying this tag.

    TagWrite:
      type: object
      required: [name]
      properties:
        name:
          type: string

    EntryKind:
      type: string
      enum: [transaction, balance_adjustment]

    Entry:
      type: object
      required:
        - id
        - account_id
        - kind
        - amount
        - booking_timestamp
        - title
        - tag_ids
        - created_at
        - updated_at
        - created_by
      properties:
        id:
          type: string
        account_id:
          type: string
        kind:
          $ref: "#/components/schemas/EntryKind"
        amount:
          type: integer
          format: int64
          description: >-
            Integer minor units at a fixed 4 decimal places (e.g. 105000
            represents 10.5000 in the account's currency). Not
            configurable — see account-entries. Always a signed delta
            applied to the account's running balance: for a transaction,
            exactly what was submitted; for a balance_adjustment, computed
            automatically as the change from the balance immediately
            before it — never client-supplied for that kind.
        balance:
          type: integer
          format: int64
          nullable: true
          description: >-
            The absolute reading a balance_adjustment's amount is computed
            against — present only when kind is balance_adjustment, null
            for a transaction. This is what the client supplies when
            creating or editing a balance_adjustment (see EntryCreate/
            EntryUpdate), at the same 4-decimal-place scale as amount.
        booking_timestamp:
          type: string
          format: date-time
        title:
          type: string
        description:
          type: string
        category_id:
          type: string
          description: >-
            Required for a transaction, optional for a balance_adjustment.
        tag_ids:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
          description: >-
            The id of the user who logged this entry — immutable after
            creation, not necessarily the account's real owner once it has
            been shared (see account-sharing).
        created_by_name:
          type: string
          description: >-
            The creator's display name (or email, as a fallback), resolved
            server-side so a viewer can see who logged an entry without a
            separate lookup.

    EntryCreate:
      type: object
      required: [account_id, kind, booking_timestamp, title]
      description: >-
        amount is required when kind is transaction and rejected when kind
        is balance_adjustment; balance is required when kind is
        balance_adjustment and rejected when kind is transaction — exactly
        one of the two, per kind (400).
      properties:
        account_id:
          type: string
        kind:
          $ref: "#/components/schemas/EntryKind"
        amount:
          type: integer
          format: int64
          description: Required for kind=transaction; must be omitted otherwise.
        balance:
          type: integer
          format: int64
          description: Required for kind=balance_adjustment; must be omitted otherwise.
        booking_timestamp:
          type: string
          format: date-time
        title:
          type: string
        description:
          type: string
        category_id:
          type: string
        tag_ids:
          type: array
          items:
            type: string

    EntryUpdate:
      type: object
      description: >-
        No kind field — it is immutable after creation. account_id may be
        set to move the entry to a different account the caller owns (see
        account-entries); it must not be disabled, the same rule creation
        applies. No currency conversion or validation is performed. amount
        is only settable when the entry's kind is transaction, balance only
        when it is balance_adjustment — supplying the other one is
        rejected (400).
      properties:
        account_id:
          type: string
        amount:
          type: integer
          format: int64
        balance:
          type: integer
          format: int64
        booking_timestamp:
          type: string
          format: date-time
        title:
          type: string
        description:
          type: string
        category_id:
          type: string
          nullable: true
          description: >-
            Explicit null clears it (only valid when the entry's kind is
            balance_adjustment).
        tag_ids:
          type: array
          items:
            type: string
          description: Replaces the full set, including clearing it with [].

    EntryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Entry"
        next_cursor:
          type: string
          nullable: true

    Balance:
      type: object
      required: [balance]
      properties:
        balance:
          type: integer
          format: int64

    CurrencySum:
      type: object
      required: [currency, amount]
      properties:
        currency:
          type: string
        amount:
          type: integer
          format: int64

    EntrySummary:
      type: object
      required: [sums, count]
      properties:
        sums:
          type: array
          items:
            $ref: "#/components/schemas/CurrencySum"
        count:
          type: integer
          format: int64

    FlowBucket:
      type: object
      required: [period, income, outcome]
      description: >-
        One period's income/outcome totals — see
        GET /api/entries/flow-summary. A currency with only income (or only
        outcome) entries in this period appears in just that one array,
        never also in the other with an amount of 0.
      properties:
        period:
          type: string
          format: date
          description: >-
            The bucket's first calendar day (YYYY-MM-DD), regardless of
            unit — a day-unit bucket is just a single day.
        income:
          type: array
          items:
            $ref: "#/components/schemas/CurrencySum"
        outcome:
          type: array
          items:
            $ref: "#/components/schemas/CurrencySum"

    BalancePoint:
      type: object
      required: [period, balances]
      description: >-
        One sample of the running account balance — see
        GET /api/entries/balance-series. balances lists one entry per
        currency present in the selected accounts, always including that
        currency even when its amount is 0.
      properties:
        period:
          type: string
          format: date
          description: >-
            The point's local calendar day (YYYY-MM-DD). The closing point
            is labelled with the first day of the following month.
        balances:
          type: array
          items:
            $ref: "#/components/schemas/CurrencySum"

security:
  - sessionCookie: []
  - bearerToken: []
