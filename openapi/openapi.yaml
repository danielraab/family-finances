openapi: 3.0.3

info:
  title: family-finances API
  version: 0.1.0
  description: >-
    The JSON HTTP API of the family-finances backend. This document is
    hand-written and is the source of truth for the API surface (see
    openapi/README.md). Operations tagged `browser-flow` and marked
    `x-internal: true` are browser-navigation redirects, not part of the
    generated typed client.

servers:
  - url: /
    description: Same-origin — the Go backend serves both the API and the SPA.

tags:
  - name: health
    description: Liveness / readiness.
  - name: auth
    description: >-
      Sign-in, session, and invites — including the admin-only user and
      invitation administration endpoints.
  - name: settings
    description: >-
      Per-user preferences (language, timezone, default currency, displayed
      decimal places).
  - name: accounts
    description: >-
      Bookkeeping accounts, each owned by exactly one user, and the
      admin-managed account_types lookup they reference.
  - name: categories
    description: The global, tree-structured, admin-managed category lookup.
  - name: tags
    description: Per-user tags, private to their owner.
  - name: entries
    description: >-
      Transactions and balance adjustments recorded against an account,
      including live balance computation and a filterable/searchable/
      sortable, cursor-paginated listing.
  - name: browser-flow
    description: >-
      Endpoints a browser reaches by full-page navigation, not fetch. Documented
      for completeness; excluded from the generated client.
  - name: meta
    description: The API describing itself.

paths:
  /api/healthz:
    get:
      operationId: getHealthz
      summary: Readiness probe — pings the database
      tags: [health]
      security: []
      responses:
        "200":
          description: The database answered a bounded ping.
          content:
            text/plain:
              schema:
                type: string
              example: ok
        "503":
          description: No database is configured or it did not answer.
          content:
            text/plain:
              schema:
                type: string

  /api/openapi.yaml:
    get:
      operationId: getOpenAPIDocument
      summary: This OpenAPI document
      tags: [meta]
      security: []
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string

  /api/auth/config:
    get:
      operationId: getAuthConfig
      summary: Sign-in methods the client should offer
      description: >-
        Unauthenticated. Reports the sign-in affordances the web client should
        render on the login page. Exposes no provider secrets.
      tags: [auth]
      security: []
      responses:
        "200":
          description: The available sign-in affordances.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"

  /api/auth/me:
    get:
      operationId: getAuthMe
      summary: The authenticated user
      tags: [auth]
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/logout:
    post:
      operationId: postAuthLogout
      summary: Revoke the current session
      tags: [auth]
      responses:
        "204":
          description: Session revoked. For a browser the ff_session cookie is cleared.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/email/start:
    post:
      operationId: postAuthEmailStart
      summary: Start a magic-link sign-in
      description: >-
        Always returns 200 regardless of whether an account exists or a mail was
        sent, to prevent account enumeration.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailStartRequest"
      responses:
        "200":
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOk"
        "400":
          description: Malformed request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/invites:
    post:
      operationId: postAuthInvites
      summary: Invite an email address
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
      responses:
        "201":
          description: Invite created and an acceptance email sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "400":
          description: Malformed request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Inviting is disabled on this instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: getAuthInvites
      summary: List every invitation (admin only)
      description: >-
        Every non-soft-deleted invite regardless of status (pending,
        accepted, expired, or revoked), newest first, each carrying the
        inviter's identity.
      tags: [auth]
      responses:
        "200":
          description: Every invitation.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/auth/invites/mine:
    get:
      operationId: getAuthInvitesMine
      summary: List the authenticated user's own invitations
      description: >-
        Every non-soft-deleted invite the caller personally created,
        regardless of status. No admin requirement.
      tags: [auth]
      responses:
        "200":
          description: The caller's own invitations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/invites/{id}/revoke:
    post:
      operationId: postAuthInviteRevoke
      summary: Revoke an invitation
      description: >-
        Permitted for the invite's own inviter or an admin. Idempotent — a
        repeat call on an already-revoked invite succeeds without changing
        its revoked_at. Permitted regardless of the invite's current status;
        a revoked invite stays visible in every listing.
      tags: [auth]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The invitation, now revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            The caller neither created this invitation nor is an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such invitation (or it has been soft-deleted).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/invites/{id}:
    delete:
      operationId: deleteAuthInvite
      summary: Soft-delete a revoked invitation (admin only)
      description: >-
        Rejected with 409 unless the invitation has already been revoked.
        One-way — there is no undelete endpoint. A soft-deleted invitation
        is excluded from both invitation listings.
      tags: [auth]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The invitation is soft-deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such invitation (or it is already soft-deleted).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/auth/users:
    get:
      operationId: getAuthUsers
      summary: List every non-deleted user (admin only)
      tags: [auth]
      responses:
        "200":
          description: Every non-soft-deleted user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/auth/users/{id}/disable:
    post:
      operationId: postAuthUserDisable
      summary: Disable a user and revoke their sessions immediately (admin only)
      description: >-
        No check prevents an admin from disabling their own account, including
        as the only remaining admin.
      tags: [auth]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The user, now disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/users/{id}/enable:
    post:
      operationId: postAuthUserEnable
      summary: Re-enable a disabled user (admin only)
      description: Does not restore any session revoked while disabled.
      tags: [auth]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The user, now enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/users/{id}:
    delete:
      operationId: deleteAuthUser
      summary: Soft-delete a user and revoke their sessions immediately (admin only)
      description: >-
        One-way in this API — there is no undelete endpoint. No check
        prevents an admin from deleting their own account, including as the
        only remaining admin.
      tags: [auth]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The user is soft-deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/settings:
    get:
      operationId: getSettings
      summary: The authenticated user's resolved settings
      description: >-
        Always fully populated — a field never set by the user resolves to
        its hardcoded application default.
      tags: [settings]
      responses:
        "200":
          description: The resolved settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: putSettings
      summary: Update one or more of the authenticated user's settings
      description: >-
        Partial update: only the fields present in the body are changed.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSettingsUpdate"
      responses:
        "200":
          description: The resolved settings after the update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
        "400":
          description: A field included in the body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/accounts:
    get:
      operationId: getAccounts
      summary: List the caller's accounts
      tags: [accounts]
      responses:
        "200":
          description: Every non-deleted account the caller owns.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: postAccounts
      summary: Create an account
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreate"
      responses:
        "201":
          description: The created account, owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/accounts/{id}:
    get:
      operationId: getAccount
      summary: Get an account
      description: >-
        404 for an account the caller does not own, identical to a
        nonexistent one — existence is not disclosed across owners.
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchAccount
      summary: Update an account
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAccount
      summary: Soft-delete an account
      description: One-way — there is no undelete endpoint.
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "204":
          description: The account is soft-deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/accounts/{id}/disable:
    post:
      operationId: postAccountDisable
      summary: Disable an account
      description: >-
        Reversible via enable. Blocks creating new entries against the
        account; does not hide it or affect its existing entries.
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: The account, now disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/accounts/{id}/enable:
    post:
      operationId: postAccountEnable
      summary: Re-enable a disabled account
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: The account, now enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/accounts/{id}/balance:
    get:
      operationId: getAccountBalance
      summary: The account's live balance
      description: >-
        Always computed live, never cached — see the account-entries
        capability. Equals the latest non-deleted balance_adjustment at or
        before as_of (or 0 if none), plus every non-deleted transaction
        after it, up to as_of.
      tags: [entries]
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - name: as_of
          in: query
          required: false
          description: RFC3339 timestamp. Defaults to now.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: The computed balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/account-types:
    get:
      operationId: getAccountTypes
      summary: List every account type
      tags: [accounts]
      responses:
        "200":
          description: Every account type.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountType"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: postAccountTypes
      summary: Create an account type (admin only)
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountTypeWrite"
      responses:
        "201":
          description: The created account type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountType"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/account-types/{id}:
    patch:
      operationId: patchAccountType
      summary: Rename an account type (admin only)
      tags: [accounts]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountTypeWrite"
      responses:
        "200":
          description: The updated account type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountType"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAccountType
      summary: Delete an account type (admin only)
      description: >-
        409 if a non-deleted account still references it — deletion is
        never cascaded.
      tags: [accounts]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The account type is deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/categories:
    get:
      operationId: getCategories
      summary: List the full category tree
      tags: [categories]
      responses:
        "200":
          description: Every category, including its parent_id.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: postCategories
      summary: Create a category (admin only)
      tags: [categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryWrite"
      responses:
        "201":
          description: The created category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/categories/{id}:
    patch:
      operationId: patchCategory
      summary: Update a category (admin only)
      description: >-
        Reparenting onto the category itself or one of its own descendants
        is rejected with 422.
      tags: [categories]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryWrite"
      responses:
        "200":
          description: The updated category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: deleteCategory
      summary: Delete a category (admin only)
      description: >-
        409 if it has child categories or is referenced by a non-deleted
        entry — deletion is never cascaded.
      tags: [categories]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The category is deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/tags:
    get:
      operationId: getTags
      summary: List the caller's tags
      tags: [tags]
      responses:
        "200":
          description: Every tag the caller owns.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: postTags
      summary: Create a tag
      tags: [tags]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagWrite"
      responses:
        "201":
          description: The created tag, owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The caller already has a tag with this name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/tags/{id}:
    patch:
      operationId: patchTag
      summary: Rename a tag
      tags: [tags]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagWrite"
      responses:
        "200":
          description: The updated tag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The caller already has a tag with this name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteTag
      summary: Delete a tag
      description: >-
        Always allowed — detaches the tag from every entry it was attached
        to rather than being blocked by use, unlike a category or account
        type.
      tags: [tags]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The tag is deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/entries:
    get:
      operationId: getEntries
      summary: List the caller's entries, filtered/searched/sorted, cursor-paginated
      tags: [entries]
      parameters:
        - name: account_id
          in: query
          required: false
          description: Repeatable. Omitted means every account the caller owns.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: category_id
          in: query
          required: false
          description: Matches this category and every descendant.
          schema:
            type: string
        - name: tag_id
          in: query
          required: false
          schema:
            type: string
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EntryKind"
        - name: from
          in: query
          required: false
          description: Inclusive booking_timestamp lower bound, RFC3339.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Inclusive booking_timestamp upper bound, RFC3339.
          schema:
            type: string
            format: date-time
        - name: q
          in: query
          required: false
          description: Case-insensitive substring match against title or description.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [booking_timestamp, amount]
            default: booking_timestamp
        - name: dir
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: after
          in: query
          required: false
          description: Opaque cursor from a previous response's next_cursor.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: A page of matching entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: postEntries
      summary: Create an entry
      description: >-
        422 when account_id does not name an account the caller owns, or
        names a disabled account.
      tags: [entries]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryCreate"
      responses:
        "201":
          description: The created entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/entries/{id}:
    get:
      operationId: getEntry
      summary: Get an entry
      tags: [entries]
      parameters:
        - $ref: "#/components/parameters/EntryId"
      responses:
        "200":
          description: The entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchEntry
      summary: Update an entry
      description: >-
        account_id and kind are immutable — there is no field for them on
        this request body at all.
      tags: [entries]
      parameters:
        - $ref: "#/components/parameters/EntryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryUpdate"
      responses:
        "200":
          description: The updated entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteEntry
      summary: Soft-delete an entry
      description: One-way — there is no undelete endpoint.
      tags: [entries]
      parameters:
        - $ref: "#/components/parameters/EntryId"
      responses:
        "204":
          description: The entry is soft-deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/auth/email/callback:
    get:
      operationId: getAuthEmailCallback
      summary: Complete a magic-link sign-in
      description: >-
        Browser clients get a 302 with the ff_session cookie set. A client
        sending `Accept: application/json` (or `?client=api`) instead gets 200
        with a session token in the body.
      tags: [browser-flow]
      x-internal: true
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Signed in; redirect to a safe in-app path.
        "400":
          description: The token is missing, invalid, expired, or already used.

  /api/auth/oidc/start:
    get:
      operationId: getAuthOidcStart
      summary: Begin the OIDC authorization-code flow
      tags: [browser-flow]
      x-internal: true
      security: []
      parameters:
        - name: redirect_to
          in: query
          required: false
          description: Safe same-origin relative path to return to after sign-in.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the identity provider.
        "404":
          description: OIDC is not configured on this instance.

  /api/auth/oidc/callback:
    get:
      operationId: getAuthOidcCallback
      summary: Complete the OIDC authorization-code flow
      description: >-
        Browser clients get a 302 with the ff_session cookie set. A client
        sending `Accept: application/json` instead gets 200 with a session token
        in the body.
      tags: [browser-flow]
      x-internal: true
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Signed in; redirect to a safe in-app path.
        "400":
          description: Missing/unknown state, provider error, or id_token verification failed.

  /api/auth/invites/accept:
    get:
      operationId: getAuthInvitesAccept
      summary: Accept an invite
      description: >-
        Browser clients get a 302 with the ff_session cookie set. A client
        sending `Accept: application/json` instead gets 200 with a session token
        in the body.
      tags: [browser-flow]
      x-internal: true
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Account created / signed in; redirect to a safe in-app path.
        "400":
          description: The invite token is missing, invalid, expired, or already used.

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ff_session
    bearerToken:
      type: http
      scheme: bearer

  responses:
    Unauthorized:
      description: No valid session was presented.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The authenticated user is not an admin.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The request conflicts with the resource's current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: >-
        No such resource — including one that belongs to a different owner,
        which behaves identically to nonexistent (existence is not
        disclosed across owners).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: A field in the request failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: >-
        The request is well-formed but violates a business rule (e.g. a
        reparent that would create a category cycle, or an entry against a
        disabled account).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  parameters:
    AccountId:
      name: id
      in: path
      required: true
      schema:
        type: string
    EntryId:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:
    User:
      type: object
      required: [id, email, is_admin, created_at, language]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        is_admin:
          type: boolean
        created_at:
          type: string
          format: date-time
        language:
          type: string
          nullable: true
          description: >-
            The account's raw, unresolved language preference, or null when
            none is set — used by the client to prioritize it over browser
            detection (see the web-client-i18n capability). Distinct from
            GET /api/settings, whose language field is always resolved to a
            default when unset.
          enum: [en, de]

    AdminUser:
      type: object
      required: [id, email, is_admin, disabled, created_at]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        is_admin:
          type: boolean
        disabled:
          type: boolean
        created_at:
          type: string
          format: date-time

    UserSettings:
      type: object
      additionalProperties: false
      required: [language, timezone, default_currency, displayed_decimal_places]
      properties:
        language:
          type: string
          enum: [en, de]
        timezone:
          type: string
        default_currency:
          type: string
        displayed_decimal_places:
          type: integer
          minimum: 0
          maximum: 4
          description: >-
            Display-only rounding preference — never affects how an amount
            is stored or edited (see account-entries' fixed 4-decimal-place
            storage).

    UserSettingsUpdate:
      type: object
      additionalProperties: false
      properties:
        language:
          type: string
          enum: [en, de]
        timezone:
          type: string
        default_currency:
          type: string
        displayed_decimal_places:
          type: integer
          minimum: 0
          maximum: 4

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        request_id:
          type: string

    StatusOk:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    EmailStartRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    InviteRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    Invite:
      type: object
      required: [id, email, expires_at, invited_by, accepted_at, revoked_at]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        expires_at:
          type: string
          format: date-time
        invited_by:
          $ref: "#/components/schemas/InviteInviter"
        accepted_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Set once, by the invite's own inviter or an admin. Blocks
            acceptance but does not remove the invite from any listing.

    InviteInviter:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string

    OidcLogin:
      type: object
      additionalProperties: false
      required: [label, start_path]
      properties:
        label:
          type: string
        start_path:
          type: string

    AuthConfig:
      type: object
      additionalProperties: false
      required: [oidc]
      properties:
        oidc:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/OidcLogin"

    Account:
      type: object
      required:
        - id
        - title
        - type_id
        - currency
        - opening_date
        - disabled
        - created_at
        - updated_at
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        type_id:
          type: string
        currency:
          type: string
          description: ISO-4217 shape (three uppercase letters), not a canonical list.
        financial_institute:
          type: string
        opening_date:
          type: string
          format: date
        closing_date:
          type: string
          format: date
        disabled:
          type: boolean
          description: >-
            Reversible; blocks creating new entries against the account.
            Independent of closing_date (informational only) and of soft
            delete.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AccountCreate:
      type: object
      required: [title, type_id, currency, opening_date]
      properties:
        title:
          type: string
        description:
          type: string
        type_id:
          type: string
        currency:
          type: string
        financial_institute:
          type: string
        opening_date:
          type: string
          format: date
        closing_date:
          type: string
          format: date

    AccountUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        type_id:
          type: string
        currency:
          type: string
        financial_institute:
          type: string
        opening_date:
          type: string
          format: date
        closing_date:
          type: string
          format: date
          nullable: true
          description: Explicit null clears it (re-opening the account).

    AccountType:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time

    AccountTypeWrite:
      type: object
      required: [name]
      properties:
        name:
          type: string

    Category:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
        parent_id:
          type: string
          description: Absent for a root category.
        name:
          type: string
        created_at:
          type: string
          format: date-time

    CategoryWrite:
      type: object
      properties:
        name:
          type: string
        parent_id:
          type: string
          nullable: true
          description: Explicit null makes it a root category.

    Tag:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time

    TagWrite:
      type: object
      required: [name]
      properties:
        name:
          type: string

    EntryKind:
      type: string
      enum: [transaction, balance_adjustment]

    Entry:
      type: object
      required:
        - id
        - account_id
        - kind
        - amount
        - booking_timestamp
        - title
        - tag_ids
        - created_at
        - updated_at
      properties:
        id:
          type: string
        account_id:
          type: string
        kind:
          $ref: "#/components/schemas/EntryKind"
        amount:
          type: integer
          format: int64
          description: >-
            Integer minor units at a fixed 4 decimal places (e.g. 105000
            represents 10.5000 in the account's currency). Not
            configurable — see account-entries.
        booking_timestamp:
          type: string
          format: date-time
        title:
          type: string
        description:
          type: string
        category_id:
          type: string
          description: >-
            Required for a transaction, optional for a balance_adjustment.
        tag_ids:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EntryCreate:
      type: object
      required: [account_id, kind, amount, booking_timestamp, title]
      properties:
        account_id:
          type: string
        kind:
          $ref: "#/components/schemas/EntryKind"
        amount:
          type: integer
          format: int64
        booking_timestamp:
          type: string
          format: date-time
        title:
          type: string
        description:
          type: string
        category_id:
          type: string
        tag_ids:
          type: array
          items:
            type: string

    EntryUpdate:
      type: object
      description: >-
        No account_id or kind field — both are immutable after creation.
      properties:
        amount:
          type: integer
          format: int64
        booking_timestamp:
          type: string
          format: date-time
        title:
          type: string
        description:
          type: string
        category_id:
          type: string
          nullable: true
          description: >-
            Explicit null clears it (only valid when the entry's kind is
            balance_adjustment).
        tag_ids:
          type: array
          items:
            type: string
          description: Replaces the full set, including clearing it with [].

    EntryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Entry"
        next_cursor:
          type: string
          nullable: true

    Balance:
      type: object
      required: [balance]
      properties:
        balance:
          type: integer
          format: int64

security:
  - sessionCookie: []
  - bearerToken: []
